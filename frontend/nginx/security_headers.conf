# Security headers for every HTTPS response. Included per location because a location with
# its own add_header no longer inherits the server-level ones.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Generated at image build from the inline scripts in index.html (see generate-csp.mjs)
include /etc/nginx/snippets/csp.conf;
