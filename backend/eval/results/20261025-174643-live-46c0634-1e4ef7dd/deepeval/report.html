-R), 10:00 AM – 11:50 AM  \n* **Course Description:**  \n  Cat. I. This course provides an introduction to economics, an introduction to entrepreneurship, and an understanding of the linkages between economics and entrepreneurship. Students apply these concepts to the assessment of opportunities that might arise from participation in WPI projects, exploring how economics and entrepreneurship can inform business and project decisions.", "reference": "Oleg Pavlov; Rosanna Garcia teaches ECON 2910, ETR 2910.", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q215", "category": "instructor_lookup", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['smart_course_search']", "question": "Which courses does Xin Gao teach?", "answer": "According to the Business School database, **Xin Gao** teaches the following 2 courses:\n\n---\n\n### 1. **FIN 3330 – Financial Analytics**\n* **Level:** Undergraduate\n* **Credits:** 3\n* **Delivery & Format:** In-Person | Lecture\n* **Term Offered:** 2026 Spring C Term\n* **Schedule & Location:** Monday & Thursday | 12:00 PM – 1:50 PM | Olin Hall 109\n* **Description:** This course provides the foundation for financial data analytics used in business and FinTech applications. Students gain experience analyzing financial data using modern machine learning techniques, statistical methods, and prediction models, developing computational skills with modern statistical programming environments.\n\n---\n\n### 2. **FIN 540 – Financial Analytics**\n* **Level:** Graduate\n* **Credits:** 3\n* **Delivery & Format:** In-Person | Lecture\n* **Term Offered:** 2026 Spring Semester\n* **Schedule & Location:** Thursday | 6:00 PM – 8:50 PM | Higgins Labs 154\n* **Description:** This course introduces advanced methodological tools required for conducting finance and investment analysis research. It equips students with working knowledge of econometric techniques used in financial economics, such as event studies, advanced time series analysis, and survival analysis.", "reference": "Xin Gao teaches FIN 3330, FIN 540.", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q216", "category": "instructor_lookup", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['smart_course_search']", "question": "Which courses does Renata Konrad teach?", "answer": "According to the WPI Business School database, **Renata Konrad** teaches the following courses:\n\n---\n\n### 1. **BUS 631: Research Methods and the Research Process**\n* **Credits:** 3  \n* **Level:** Graduate (PhD level)  \n* **Delivery:** Hybrid / Online-asynchronous  \n* **Term Offered:** Fall 2025 Semester  \n* **Description:** This course introduces PhD students to business problems and the nature, scope, and purpose of research and research methodologies to study those problems. Topics include research approaches and designs, data types and collection methods, measurement approaches, testing procedures, interpreting and presenting findings, and the ethics of various research methods.\n\n---\n\n### 2. **OIE 3510: Stochastic Models**\n* **Credits:** 3  \n* **Level:** Undergraduate  \n* **Delivery:** In-Person (Stratton Hall 201)  \n* **Term Offered:** Spring 2026 D Term (Tuesday & Friday, 10:00 AM – 11:50 AM)  \n* **Description:** An introductory course in probabilistic models and decision-making under risk, with applications to engineering and management decision-making. Topics cover quantitative methods for evaluating risks, decision-making under risk across management and engineering problems, and stochastic modeling techniques.", "reference": "Renata Konrad teaches BUS 631, OIE 3510.", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q217", "category": "instructor_lookup", "metric": "tool_selection", "score": 0.0, "success": false, "reason": "called ['business_school_database']; acceptable ['smart_course_search']", "question": "Which courses does Andrew Trapp teach?", "answer": "According to the Business School database, **Andrew Trapp** teaches the following 3 courses:\n\n---\n\n### 1. **OIE 2081 – Introduction To Prescriptive Analytics**\n* **Level:** Undergraduate\n* **Credits:** 3\n* **Term Offered:** 2026 Spring C Term\n* **Delivery:** In-Person\n* **Schedule & Location:** Olin Hall 223 | Tuesday & Friday | 2:00 PM – 3:50 PM\n* **Description:** An introduction to prescriptive analytics, focusing on the application of mathematical and computational sciences (such as linear optimization and simulation) to recommend optimal courses of action for decision-making.\n\n---\n\n### 2. **OIE 4430 – Advanced Prescriptive Analytics: From Data to Impact**\n* **Level:** Undergraduate\n* **Credits:** 3\n* **Term Offered:** 2025 Fall A Term\n* **Delivery:** In-Person\n* **Schedule & Location:** Unity Hall 420 | Monday & Thursday | 2:00 PM – 3:50 PM\n* **Description:** An in-depth focus on prescriptive analytics, using data, assumptions, and mathematical modeling of real-world decision problems to ascertain and recommend optimal courses of action from conceptualization to implementation.\n\n---\n\n### 3. **OIE 559 – Advanced Prescriptive Analytics: From Data to Impact**\n* **Level:** Graduate\n* **Credits:** 3\n* **Term Offered:** 2025 Fall Semester\n* **Delivery:** In-Person / Online-Synchronous\n* **Schedule & Location:** \n  * *Part 1 (08/21/2025 – 10/10/2025):* Unity Hall 420 | Monday & Thursday | 2:00 PM – 3:50 PM\n  * *Part 2 (10/20/2025 – 12/12/2025):* Online-synchronous | Monday & Thursday | 2:00 PM – 3:50 PM\n* **Description:** The graduate-level course providing an advanced study of prescriptive analytics, using mathematical modeling and data-driven methods to translate complex decision problems into actionable recommendations.", "reference": "Andrew Trapp teaches OIE 2081, OIE 4430, OIE 559.", "tools": ["business_school_database"]}, {"id": "q218", "category": "instructor_lookup", "metric": "tool_selection", "score": 0.0, "success": false, "reason": "called ['business_school_database']; acceptable ['smart_course_search']", "question": "Which courses does Joseph Sarkis teach?", "answer": "According to the Business School database, **Joseph Sarkis** teaches the following 3 graduate courses:\n\n---\n\n### 1. **OIE 544: Supply Chain Analysis and Design**\n* **Credits:** 3  \n* **Level:** Graduate  \n* **Delivery:** Hybrid  \n* **Term Offered:** Fall 2025  \n* **Description:** Focuses on the decisions, strategies, and analytical methods involved in designing, analyzing, evaluating, and managing supply chains. It covers concepts, techniques, and frameworks for optimizing supply chain performance, along with how digital technologies enable companies to improve efficiency and flexibility.\n\n---\n\n### 2. **OIE 549: Sustainable Supply Chain and Operations Management**\n* **Credits:** 3  \n* **Level:** Graduate  \n* **Delivery:** Online (Asynchronous)  \n* **Term Offered:** Spring 2026  \n* **Description:** Investigates the practice and theory of sustainable supply chains and the environmental responsibilities of organizations, extending from internal operations management to inter-organizational networks and partnerships.\n\n---\n\n### 3. **OIE 597: Operations and Supply Chain Consulting Project**\n* **Credits:** 3  \n* **Level:** Graduate  \n* **Delivery:** Hybrid (Tuesdays, 6:00 PM – 8:50 PM, Salisbury Labs 407)  \n* **Term Offered:** Spring 2026  \n* **Description:** A capstone course serving as a practical integration of operations and supply chain theories, tools, and practices learned in the MS program through a major team-based project sponsored by an external organization.\n\n---\n\nIf you have questions about prerequisites, degree requirements, or how any of these courses fit into your plan of study, please let me know your program of study!", "refer ith marketing strategies to build brand equity.", "reference": "Purvi Shah teaches BUS 594, BUS 632, MKT 562, MKT 569.", "tools": ["business_school_database"]}, {"id": "q220", "category": "instructor_lookup", "metric": "tool_selection", "score": 0.0, "success": false, "reason": "called ['business_school_database']; acceptable ['smart_course_search']", "question": "Which courses does Soussan Djamasbi teach?", "answer": "According to the Business School database, Professor Soussan Djamasbi teaches the following 3 courses:\n\n---\n\n### 1. **MIS 4741: User Experience and Design**\n* **Level:** Undergraduate\n* **Credits:** 3\n* **Delivery:** In-Person\n* **Offering:** Fall 2025 (B Term)\n* **Schedule:** Mondays & Thursdays, 2:00 PM – 3:50 PM (Washburn 323)\n* **Description:** Focuses on the newest developments in the field of user experience (UX), including physiological measures such as eye tracking in UX design, and provides an introduction to methods used in cutting-edge research laboratories to study user experience.\n\n---\n\n### 2. **MIS 583: User Experience Applications**\n* **Level:** Graduate\n* **Credits:** 3\n* **Delivery:** Hybrid\n* **Offering:** Spring 2026 Semester\n* **Schedule:** Thursdays, 11:00 AM – 12:30 PM (Washburn Second Floor)\n* **Description:** Introduces UX methods to study user experience using modern research tools, including eye tracking and emotion detection, to evaluate technological products and services.\n\n---\n\n### 3. **MIS 585: User Experience Design**\n* **Level:** Graduate\n* **Credits:** 3\n* **Delivery:** Hybrid\n* **Offering:** Fall 2025 Semester\n* **Schedule:** Mondays, 4:00 PM – 5:20 PM (Olin Hall 109)\n* **Description:** Offers hands-on experience through real-world projects, helping students develop a strong portfolio showcasing their skills in UX/UI design.", "reference": "Soussan Djamasbi teaches MIS 4741, MIS 583, MIS 585.", "tools": ["business_school_database"]}, {"id": "q221", "category": "instructor_lookup", "metric ry:** In-Person (Salisbury Labs 406)\n* **Schedule:** Spring 2026 (C Term) | Monday – Thursday | 10:00 AM – 11:50 AM\n* **Description:** Focuses on the basic knowledge and processes required of managers to understand behavior in organizations and apply this knowledge to organizational change. Key topics include communication and trust, power and leadership, group and intergroup processes, conflict, and conflict management.\n\n---\n\n### 2. **OBC 506 – Leadership**\n* **Level:** Graduate\n* **Credits:** 3\n* **Delivery:** In-Person (Salisbury Labs 411)\n* **Schedule:** Spring 2026 Semester | Wednesdays | 6:00 PM – 8:50 PM\n* **Description:** Explores how to mobilize personal and collective energy toward developing sustainable outcomes and meaningful change in rapidly changing business environments. The course embraces a human-centered design approach to leadership and influence without direct authority.", "reference": "Steve Taylor teaches OBC 3354, OBC 506.", "tools": ["business_school_database"]}, {"id": "q223", "category": "instructor_lookup", "metric": "tool_selection", "score": 0.0, "success": false, "reason": "called ['business_school_database']; acceptable ['smart_course_search']", "question": "Which courses does Daniel Treku teach?", "answer": "According to the WPI Business School database, **Daniel Treku** teaches the following 4 courses:\n\n---\n\n### 1. **FIN 510 – Business Applications of Blockchain Technology**\n* **Level:** Graduate\n* **Credits:** 3\n* **Delivery & Location:** Hybrid | Higgins Labs 154\n* **Offered:** 2026 Spring Semester\n* **Schedule:** Mondays, 6:00 PM – 8:50 PM\n* **Description:** Provides a foundation in blockchain technology and distributed ledger technologies, examining applications across disciplines such as engineering, law, and economics.\n\n---\n\n### 2. **MIS 2300 – Business Applications of Blockchain**\n* **Level:** Undergraduate (Cat. I)\n* **Credits:** 3\n* **Delivery & Location:** In-Person | Unity Hall 405\n* **Offered:** 2026 Spring C Term\n* **Schedule:** Monday – Thursday, 2:00 PM – 3:50 PM\n* **Description:** Introduces fundamental concepts and functionality of blockchain technology, exploring how it records, organizes, verifies information, and implements smart contracts across financial and non-financial domains.\n\n---\n\n### 3. **MIS 510 – Business Applications of Blockchain Technology**\n* **Level:** Graduate\n* **Credits:** 3\n* **Delivery & Location:** Hybrid | Higgins Labs 154\n* **Offered:** 2026 Spring Semester\n* **Schedule:** Mondays, 6:00 PM – 8:50 PM\n* **Description:** Provides students with a foundation in blockchain technology and explores diverse blockchain and distributed ledger technologies across disciplines like engineering, law, and economics *(cross-listed with FIN 510)*.\n\n---\n\n### 4. **MIS 584 – Business Intelligence**\n* **Level:** Graduate\n* **Credits:** 3\n* **Delivery & Location:** Online (Asynchronous)\n* **Offered:** 2026 Spring Semester\n* **Schedule:** Online-asynchronous\n* **Description:** Focuses on designing, developing, and using business dashboards for monitoring organizational performance and making data-driven decisions using business intelligence software.", "reference": "Daniel Treku teaches FIN 510, MIS 2300, MIS 510, MIS 584.", "tools": ["business_school_database"]}, {"id": "q224", "category": "instructor_lookup", "metric": "tool_selection", "score": 0.0, "success": false, "reason": "called ['business_school_database']; acceptable ['smart_course_search']", "question": "Which courses does Bengisu Tulu teach?", "answer": "According to the Business School database, **Bengisu Tulu** teaches the following courses:\n\n---\n\n### 1. **MIS 3787: Business Applications of Machine Learning**\n* **Level:** Undergraduate\n* **Credits:** 3\n* **Delivery:** In-Person\n* **Term Offered:** Spring 2026 (C Term)\n* **Schedule:** Tuesday & Friday | 12:00 PM – 1:50 PM\n* **Location:** Stratton Hall 201\n* **Description:** This course offers a business-focused introduction to data analytics. Using cutting-edge tools and approaches to the analysis of data through supervised machine learning, the course teaches how to utilize “big data” for effective decision-making.\n\n---\n\n### 2. **MIS 573: System Design and Development**\n* **Level:** Graduate\n* **Credits:** 3\n* **Delivery:** Hybrid\n* **Term Offered:** Spring 2026 Semester\n* **Schedule:** Tuesday | 6:00 PM – 8:50 PM\n* **Location:** Fuller Labs 320\n* **Description:** This course introduces students to the concepts and principles of systems analysis and design. It covers all aspects of the systems development life cycle, from project identification through project planning and management, requirements identification and specification, to process and data modeling.\n\n---\n\nIf you need more details about prerequisites, course planning, or how either course fits into your degree requirements, please let me know!", "reference": "Bengisu Tulu teaches MIS 3787, MIS 573.", "tools": ["business_school_database"]}, {"id": "q225", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Data-driven Strategic Management specialty in the MBA in Analytics?", "answer": "According to the Business School database and graduate catalog, the **Data-driven Strategic Management** specialty in the **MBA in Analytics** requires you to complete **3 courses** (9 credits) from the following 4 options:\n\n* **BUS 546:** Managing Technological Innovation (3 credits)\n* **ETR 593:** Technology Commercialization (3 credits)\n* **MIS 576:** Project Management (3 credits)\n* **MKT 569:** Product Management (3 credits)\n\n---\n\n### Specialty Overview\n* **Requirement:** Select and complete any **3** of the 4 courses above.\n* **Degree Context:** In the MBA in Analytics program, students complete 2 required specialties (Capstone and Core courses) plus **2 optional specialties** (3 courses each).\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Data-driven Strategic Management (MBA in Analytics : Master of Business Administration): BUS 546, ETR 593, MIS 576, MKT 569", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q226", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Advanced Business Analytics Methods specialty in the MBA?", "answer": "According to the WPI Business School database, to complete the **Advanced Business Analytics Methods** specialty in the **Master of Business Administration (MBA)** program, you must complete **3 courses** (9 credits). \n\nThe courses required for this specialty are:\n\n1. **MIS 587** – *Business Applications in Machine Learning* (3 credits)\n2. **MKT 562** – *Marketing Research* (3 credits)\n3. **OIE 559** – *Advanced Prescriptive Analytics: From Data to Impact* (3 credits)\n\nBecause the specialty requires 3 courses and lists these 3 specific courses, you would take all three to satisfy the specialty requirements.\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Advanced Business Analytics Methods (Master of Business Administration): MIS 587, OIE 559, MKT 562", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q227", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Applied Analytics specialty in the MBA?", "answer": "According to the Business School database, the available courses depend slightly on whether you are enrolled in the standard **Master of Business Administration (MBA)** or the **MBA in Analytics**.\n\n---\n\n### 1. Master of Business Administration (MBA) – **Applied Analytics Specialty**\nTo complete the **Applied Analytics** specialty in the standard MBA, you must take **3 courses** (9 credits) from the following 5 options:\n\n* **DS 501 – Introduction to Data Science** (3 credits)  \n  *Covers key methodologies for working with big data, including data collection, integration, management, modeling, visualization, predictive modeling, and data ethics/privacy.*\n* **DS 502 – Statistical Methods for Machine Learning** (3 credits; cross-listed with MA 543)  \n  *Surveys statistical methods used in machine learning applications, including regression, time series, clustering, dimension reduction, and classification.*\n* **MIS 502 – Data Management for Analytics** (3 credits)  \n  *Focuses on data cleaning, preparation, SQL querying, and relational database management for organizational data.*\n* **MIS 584 – Business Intelligence** (3 credits)  \n  *Focuses on business dashboards, KPI tracking, and using BI software to support data-driven decision-making.*  \n  *(Note: MIS 584 is also part of the standard MBA core curriculum. Be sure to check with your academic advisor regarding double-counting rules or petitions if you take it as a core requirement.)*\n* **MIS 587 – Business Applications in Machine Learning** (3 credits)  \n  *Covers AutoML and applied machine learning tools to solve practical business problems (e.g., customer churn, credit default, and predictive analytics).*\n\n---\n\n### 2. MBA in Analytics – **Applied Business Analytics Specialty**\nIf you are enrolled in the **MBA in Analytics** degree program, the corresponding specialty is **Applied Business Analytics**, which requires **3 courses** (9 credits) chosen from:\n\n* **FIN 540 – Financial Analytics**\n* **MIS 584 – Business Intelligence**\n* **MIS 587 – Business Applications in Machine Learning**\n* **MKT 568 – Data Mining Business Applications**\n* **OIE 552 – Modeling and Optimizing Operations**\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Applied Analytics (Master of Business Administration): DS 501, DS 502, MIS 587, MIS 584, MIS 502, MKT 568, OIE 559", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q228", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Digital Transformation specialty in the MBA?", "answer": "According to the WPI Business School database, the **Digital Transformation** specialty in the Master of Business Administration (MBA) program requires a total of **3 courses**, structured into three categories:\n\n---\n\n### **1. Digital Transformation – 1 (Take 1 course)**\n* **MIS 500**: Innovating with Information Systems\n\n---\n\n### **2. Digital Transformation – 2 (Choose 1 course)**\n* **OIE 501**: Operations Management\n* **OIE 544**: Supply Chain Analysis and Design\n* **OIE 558**: Designing and Managing Lean Six Sigma Processes\n\n---\n\n### **3. Digital Transformation – 3 (Choose 1 course)**\n* **MIS 576**: Project Management\n* **OBC 533**: Negotiations\n* **OBC 537**: Leading Change\n\n---\n\n*(Note: In the MBA program, OIE 501 is also part of the MBA core requirements. If you have already taken or plan to take OIE 501 as a core course, you can select OIE 544 or OIE 558 to fulfill the Digital Transformation – 2 requirement).*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Digital Transformation (Master of Business Administration): MIS 500, OIE 558, OIE 501, OIE 544, MIS 576, OBC 537, OBC 533", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q229", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Entrepreneurship specialty in the MBA?", "answer": "According to the Business School database, the **Entrepreneurship** specialty is an optional specialty offered under the **Master of Business Administration (MBA)** program. \n\nTo complete this specialty, you must take **3 courses (9 credits)** structured as follows:\n\n---\n\n### **1. Entrepreneurship – 1 (Required: 1 course)**\nYou must take:\n* **ETR 500: Entrepreneurship and Innovation** (3 credits)  \n  *Focuses on entrepreneurial thinking, identifying and exploiting opportunities, new venture creation, and commercialization strategies.*\n\n---\n\n### **2. Entrepreneurship – 2 (Electives: Choose 2 courses)**\nSelect any **two** courses from the following list:\n* **BUS 500: Business Law, Ethics and Social Responsibility** (3 credits)  \n  *Covers corporate and international law, intellectual property, venture formation, and business ethics.*\n* **BUS 546: Managing Technological Innovation** (3 credits)  \n  *Covers models of industrial innovation, product and process development, and technology transfer.*\n* **ETR 593: Technology Commercialization** (3 credits)  \n  *Examines the evaluation of new technologies, IP transfer, and positioning products and services into commercial markets.*\n* **ETR 596: Selling and Sales** (3 credits)  \n  *Focuses on the sales process, pitching to investors and stakeholders, and building effective customer sales models.*\n\n---\n\n*(Note: If you are enrolled in the **MBA in Analytics** program track rather than the standard MBA, this specific specialty is not offered; the standard MBA curriculum offers this specialty option.)*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Entrepreneurship (Master of Business Administration): ETR 500, BUS 500, BUS 546, ETR 596, ETR 593", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q230", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Information Systems Design specialty in the MBA?", "answer": "According to the database, for the **Information Systems Design** specialty in the **Master of Business Administration (MBA)** program, you are required to complete **3 courses** (9 credits total). \n\nThe courses specified for this specialty are:\n\n1. **MIS 571 – Database Applications Design and Development** (3 credits)\n   * *Overview:* Focuses on computer-based data management, database design to meet organizational analytics needs, data integrity, data quality, security, and backup/recovery procedures.\n2. **MIS 582 – Information Security Management** (3 credits)\n   * *Overview:* Introduces the fundamentals of information security management, enterprise security risks, and the managerial responsibilities required to protect an organization's digital assets.\n3. **MIS 585 – User Experience Design** (3 credits)\n   * *Overview:* Covers user-centered product and service design best practices, UX/UI principles, prototyping, and creating design portfolios that align with business strategy.\n\n*(Note: In the MBA program structure, selecting this specialty requires completing all three of the courses listed above.)*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Information Systems Design (Master of Business Administration): MIS 571, MIS 582, MIS 585", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q231", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Information Technology specialty in the MBA?", "answer": "According to the Business School database, to complete the **Information Technology** specialty in the **Master of Business Administration (MBA)** program, you must complete **all 3** of the following courses:\n\n---\n\n### Required Courses for the Information Technology Specialty:\n\n1. **MIS 502: Data Management for Analytics**\n   - **Credits:** 3\n   - **Description:** Focuses on the core skills needed for handling organizational data, including cleaning and preparing data for analysis, writing SQL queries to access and manipulate data, and addressing the ethical use of data and privacy issues.\n\n2. **MIS 581: Policy and Strategy for Information Technology, Artificial Intelligence, and Analytics**\n   - **Credits:** 3\n   - **Description:** Covers the core capabilities IT executives and managers must consider when creating strategy and policy for deploying IT, AI tools, and analytics within an organization. Focuses on both operational deployment and strategic decision-making.\n\n3. **MIS 584: Business Intelligence**\n   - **Credits:** 3\n   - **Description:** Focuses on designing, developing, and using business dashboards and software to monitor organizational performance and make data-driven decisions using key performance indicators (KPIs).\n\n---\n\n*(Note: In the standard MBA curriculum, **MIS 584** is also listed among the MBA core course requirements. If you have coursework overlap or prior expertise, students may petition to take a more advanced course.)*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Information Technology (Master of Business Administration): MIS 584, MIS 502, MIS 581", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q232", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the IT User Experience specialty in the MBA?", "answer": "According to the Business School database and graduate catalog, the **IT User Experience** specialty in the **Master of Business Administration (MBA)** requires **3 courses** (9 credits total). \n\nBecause the specialty requires 3 courses and lists exactly 3 courses, you must take all three of the following to complete it:\n\n---\n\n### **Required Courses for IT User Experience Specialty**\n\n1. **MIS 583: User Experience Applications** (3 credits)\n   * **Focus:** Introduces UX methods and tools (such as eye tracking and emotion detection) to study the user experience of technological products and services, bridging theoretical concepts with practical skills.\n\n2. **MIS 586: User Experience Methods** (3 credits)\n   * **Focus:** Covers research methodologies and industry-standard tools (both qualitative and quantitative) for conducting UX research, including persona development, customer journey maps, surveys, and usability testing.\n\n3. **MKT 561: Consumer Behavior and Analytics** (3 credits)\n   * **Focus:** Explores traditional theories of consumer behavior combined with modern consumer data analytics to make strategic, customer-centric business decisions.\n\n---\n\n*(Note: If you are looking at related UX options, the MBA also offers an **Innovation with User Experience (IUX Core)** specialty which consists of MIS 583, MIS 585, and MIS 586).*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "IT User Experience (Master of Business Administration): MIS 583, MIS 586, MKT 561", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q233", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Operations Excellence specialty in the MBA?", "answer": "According to the Business School database, the **Operations Excellence** specialty in the **Master of Business Administration (MBA)** requires a total of **3 courses (9 credits)**, structured across two requirement groups:\n\n---  complete the **Operations Analytics** specialty in the MBA in Analytics, you must choose **3 courses** from the following list:\n\n* **OIE 501:** Operations Management (3 credits) *(Note: OIE 501 is also listed as a core requirement for this program)*\n* **OIE 542:** Risk Management and Decision Making (3 credits)\n* **OIE 544:** Supply Chain Analysis and Design (3 credits)\n* **OIE 548:** Performance Analytics (3 credits)\n* **OIE 549:** Sustainable Supply Chain and Operations Management (3 credits)\n\n---\n\n### 2. Master of Business Administration (Standard MBA)\nTo complete the **Operations Analytics** specialty in the standard MBA, you must choose **3 courses** from the following list:\n\n* **OIE 501:** Operations Management (3 credits) *(Note: OIE 501 is also listed as a core requirement for this program)*\n* **OIE 542:** Risk Management and Decision Making (3 credits)\n* **OIE 544:** Supply Chain Analysis and Design (3 credits)\n* **OIE 548:** Performance Analytics (3 credits)\n* **OIE 558:** Designing and Managing Lean Six Sigma Processes (3 credits)\n\n*(Note: The standard MBA also offers a related **Advanced Operations Analytics** specialty, which includes tracks with MIS 587, MKT 562, OIE 542, OIE 548, and OIE 559).*\n\n---\n\n### Next Steps & Degree Planning\nIf you are planning your upcoming schedule and have an unofficial transcript, you can upload it using the paperclip icon so we can review which core courses and electives you have already satisfied!\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Operations Analytics (Master of Business Administration): OIE 558, OIE 501, OIE 548, OIE 542, OIE 544", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q235", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'sm <script>
const D = JSON.parse(document.getElementById('data').textContent);
const S = D.summary, M = S.metrics || {};
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? n.className = v : n.setAttribute(k, v);
  for (const k of kids) n.append(k instanceof Node ? k : document.createTextNode(k ?? ''));
  return n;
};
const fmt = v => v == null ? '–' : (+v).toFixed(2);
const pct = v => v == null ? '–' : Math.round(v * 100) + '%';
const tone = (v, t) => v == null ? 'na' : v >= (t ?? 0.8) ? 'ok' : v >= (t ?? 0.8) * 0.75 ? 'mid' : 'low';
const color = v => v == null ? 'var(--tint)' : v >= 0.85 ? 'var(--good)' : v >= 0.6 ? 'var(--warn)' : 'var(--bad)';

document.getElementById('meta').append(
  'Run ', el('code', {}, S.run || ''), ' · judge ', el('code', {}, S.judge || ''), ' · generated ', D.generated);

const cards = document.getElementById('cards');
for (const key of ['tool_selection', 'faithfulness', 'answer_relevancy', 'correctness']) {
  const m = M[key]; if (!m) continue;
  const bar = el('div', {class: 'bar'}, el('span', {style: `width:${(m.mean || 0) * 100}%;background:${color(m.mean)}`}));
  cards.append(el('div', {class: 'card'},
    el('div', {class: 'name'}, D.labels[key] || key),
    el('div', {class: 'big'}, fmt(m.mean)),
    el('div', {class: 'sub'}, `${pct(m.pass_rate)} pass (≥ ${D.thresholds[key]}) · ${m.n} items` +
      (m.judge_errors ? ` · ${m.judge_errors} judge errors` : '')),
    bar, el('div', {class: 'help'}, D.help[key] || '')));
}
if (M.oos_refusal) {
  const r = M.oos_refusal;
  cards.append(el('div', {class: 'card'}, el('div', {class: 'name'}, 'Out-of-scope refusal'),
    el('div', {class: 'big'}, pct(r.rate)), el('div', {class: 'sub'}, `${r.n} items · deterministic`),
    el('div', {class: 'bar'}, el('span', {style: `width:${r.rate * 100}%;background:${color(r.rate)}`})),
    el('div', {class: 'help'}, 'Off-topic questions stopped by the intent gate.')));
}

// Category × metric heatmap
const metrics = ['correctness', 'faithfulness', 'answer_relevancy', 'tool_selection'].filter(k => M[k]);
const cats = [...new Set(D.rows.map(r => r.category))].sort();
const avg = (c, k) => { const v = D.rows.filter(r => r.category === c && r.metric === k && r.score != null).map(r => r.score);
                        return v.length ? {mean: v.reduce((a, b) => a + b, 0) / v.length, n: v.length} : null; };
const heat = el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Category'),
  ...metrics.map(k => el('th', {class: 'num'}, D.labels[k])))));
const hb = el('tbody');
for (const c of cats) {
  hb.append(el('tr', {}, el('td', {}, c), ...metrics.map(k => {
    const a = avg(c, k);
    return el('td', {class: 'heat', title: a ? `${a.n} items` : 'not scored'},
      a ? el('span', {class: 'pill ' + tone(a.mean, D.thresholds[k])}, fmt(a.mean)) : el('span', {class: 'na'}, '–'));
  })));
}
heat.append(hb);
document.getElementById('heat').append(heat);

// Judge agreement
if (S.judge_agreement) {
  const a = S.judge_agreement;
  const box = document.getElementById('agreement');
  box.append(el('h2', {}, 'Agreement with the run\'s Gemini judge (faithfulness)'));
  const stat = (name, value, sub) => el('div', {class: 'card'}, el('div', {class: 'name'}, name),
    el('div', {class: 'big'}, value), el('div', {class: 'sub'}, sub));
  box.append(el('div', {class: 'agree'},
    stat('DeepEval mean', fmt(a.deepeval_mean), `${a.n} items scored by both`),
    stat('Gemini judge mean', fmt(a.gemini_judge_mean), 'same-family judge'),
    stat('Pearson r', a.pearson == null ? '–' : a.pearson.toFixed(2), 'noisy on small samples'),
    stat('Agree: fully supported', pct(a.fully_supported_agreement), 'same verdict on "every claim supported"')));
  box.append(el('p', {class: 'note'}, 'Where the judges disagree, read the item by hand: that is where a score is least trustworthy.'));
}

// Explorer
const fc = document.getElementById('f-cat'), fm = document.getElementById('f-metric');
cats.forEach(c => fc.append(el('option', {value: c}, c)));
[...new Set(D.rows.map(r => r.metric))].sort().forEach(m => fm.append(el('option', {value: m}, D.labels[m] || m)));
const tbody = document.getElementById('rows');
const PAGE = 50;
let showAll = false;
function render() {
  const cat = fc.value, met = fm.value, fail = document.getElementById('f-fail').checked;
  const llmOnly = document.getElementById('f-llm').checked && !met;
  const q = document.getElementById('f-q').value.toLowerCase();
  const list = D.rows.filter(r => (!cat || r.category === cat) && (!met || r.metric === met)
      && (!fail || r.success === false) && (!llmOnly || r.metric !== 'tool_selection')
      && (!q || (r.question + ' ' + r.answer + ' ' + r.reason).toLowerCase().includes(q)))
    .sort((a, b) => (a.score ?? 2) - (b.score ?? 2) || a.id.localeCompare(b.id));
  tbody.replaceChildren();
  const more = document.getElementById('more');
  more.hidden = showAll || list.length <= PAGE;
  more.textContent = `Show all ${list.length}`;
  for (const r of showAll ? list : list.slice(0, PAGE)) {
    const result = r.score == null ? el('span', {class: 'na'}, 'error')
      : el('span', {class: 'pill ' + (r.success ? 'ok' : 'low')}, r.success ? 'pass' : 'fail');
    const row = el('tr', {class: 'row'}, el('td', {}, r.id), el('td', {}, r.category), el('td', {}, D.labels[r.metric] || r.metric),
      el('td', {class: 'num'}, el('span', {class: 'pill ' + tone(r.score, D.thresholds[r.metric])}, fmt(r.score))),
      el('td', {}, result), el('td', {}, (r.reason || '').slice(0, 140) + ((r.reason || '').length > 140 ? '…' : '')));
    const box = (k, v, full) => el('div', {class: full ? 'full' : ''}, el('div', {class: 'k'}, k), el('div', {class: 'v'}, v || '–'));
    const detail = el('tr', {class: 'detail', hidden: ''}, el('td', {colspan: '6'}, el('div', {class: 'detail-grid'},
      box('Question', r.question, true), box("Agent's answer", r.answer), box('Reference answer', r.reference),
      box("Judge's reason", r.reason, true), box('Tools used', r.tools.join(', '), true))));
    row.addEventListener('click', () => detail.hidden = !detail.hidden);
    tbody.append(row, detail);
  }
  const shown = showAll ? list.length : Math.min(list.length, PAGE);
  document.getElementById('count').textContent = `${shown} shown · ${list.length} match · ${D.rows.length} scores`;
}
document.getElementById('more').addEventListener('click', () => { showAll = true; render(); });
['f-cat', 'f-metric', 'f-fail', 'f-llm'].forEach(id => document.getElementById(id).addEventListener('change', () => { showAll = false; render(); }));
document.getElementById('f-q').addEventListener('input', render);
render();
</script>
</body>
</html>
