the commonly used techniques for designing and evaluating an effective logistics network will be studied.", "reference": "'Global Purchasing And Logistics' is OIE 553.", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q032", "category": "course_lookup", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['smart_course_search']; acceptable ['smart_course_search']", "question": "Who teaches MKT 562?", "answer": "According to the database, **MKT 562 (Marketing Research)** is taught by **Purvi Shah**.\n\n### Course Details:\n- **Course Code & Title:** MKT 562 – Marketing Research\n- **Instructor:** Purvi Shah\n- **Credits:** 3 credits\n- **Offered:** Fall 2025 Semester\n- **Format / Delivery:** In-Person Lecture (Stratton Hall 201)\n- **Description:** This course equips students with research methods and tools used for marketing decision-making. Students learn to conduct, use, apply, interpret, and present marketing research covering problem formulation, research design, data collection methods, data analysis, and research plan presentation.", "reference": "MKT 562 is taught by Purvi Shah.", "tools": ["smart_course_search"]}, {"id": "q033", "category": "course_lookup", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['smart_course_search']; acceptable ['smart_course_search']", "question": "How many credits is ETR 593?", "answer": "According to the course database and catalog, **ETR 593 (Technology Commercialization)** is **3 credits**.", "reference": "ETR 593 is worth 3 credits.", "tools": ["smart_course_search"]}, {"id": "q034", "category": "course_lookup", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['smart_course_search']", "question": "What is the course title of BUS 599?", "answer": "According to the Business School database, the course title of **BUS 599** is **Capstone Project**.", "reference": "BUS 599 is 'Capstone Project'.", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q035", "category": "course_lookup", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['smart_course_search']", "question": "What is the course code for 'Master Of Science Capstone Project'?", "answer": "According to the Business School database and graduate course catalog, the course code for **Master Of Science Capstone Project** is:\n\n* **Course Code:** **BUS 596**\n* **Title:** Master Of Science Capstone Project\n* **Credits:** 3\n* **Subject:** Business\n\n### Course Details\n* **Description:** This course serves as the capstone for STEM-based specialty MS programs in the WPI Business School. It integrates STEM-based tools, techniques, and skills with relevant business theories and practices through a major team-based corporate project addressing actual business needs. Students produce a written report and formally present their findings to project sponsors.\n* **Prerequisites/Expectation:** Students are expected to have completed (or be currently completing) all course requirements for their MS program prior to enrolling.", "reference": "'Master Of Science Capstone Project' is BUS 596.", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q036", "category": "course_lookup", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['smart_course_search']; acceptable ['smart_course_search']", "question": "Who teaches MKT 569?", "answer": "According to the Business School course database, **MKT 569 (Product Management)** is taught by:\n\n* **Instructor:** Purvi Shah\n\n### Course Details\n* **Credits:** 3\n* **Format / Delivery:** Online (Asynchronous lecture)\n* **Upcoming Offering:** Spring Semester 2026", "reference": "MKT 569 is taught by Purvi Shah.", "tools": ["smart_course_search"]}, {"id": "q037", "category": "course_lookup", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['smart_course_search']; acceptable ['smart_course_search']", "question": "How many credits is FIN 540?", "answer": "According to the Business School database, **FIN 540: Financial Analytics** is worth **3 credits**.", "reference": "FIN 540 is worth 3 credits.", "tools": ["smart_course_search"]}, {"id": "q038", "category": "course_lookup", "metric": "tool_selection", "score": 0.0, "success": false, "reason": "called ['business_school_database']; acceptable ['smart_course_search']", "question": "What is the course title of MIS 585?", "answer": "According to the database, the course title of **MIS 585** is **User Experience Design**.", "reference": "MIS 585 is 'User Experience Design'.", "tools": ["business_school_database"]}, {"id": "q039", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the core courses for the MBA in Analytics?", "answer": "According to the WPI Business School database, the **MBA in Analytics** program requires **6 core/required courses** (18 credits) across two required categories:\n\n---\n\n### **1. MBA in Analytics Core Courses (4 courses)**\n* **FIN 500:** Financial Management\n* **MIS 502:** Data Management for Analytics\n* **MKT 500:** Marketing Strategy\n* **OIE 501:** Operations Management\n\n---\n\n### **2. Capstone Requirement (2 courses)**\n* **BUS 594:** Data-driven Business Strategy (Capstone)\n* **OBC 505:** Teaming and Organizing for Innovation\n\n---\n\n### **Additional Degree Requirements**\nIn addition to the 6 required core and capstone courses, students complete **2 optional specialties** (3 courses each / 6 courses total) chosen from:\n* Applied Business Analytics\n* Data-driven Strategic Management\n* Marketing Analytics\n* Operations Analytics", "reference": "Core: MIS 502, FIN 500, MKT 500, OIE 501", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q040", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the capstone requirements for the MBA in Analytics?", "answer": "According to the Business School database, the **MBA in Analytics : Master of Business Administration** program requires **2 courses (6 credits total)** to satisfy the **Capstone** requirement:\n\n---\n\n### Capstone Requirements (Must Complete Both Courses)\n\n1. **BUS 594: Data-driven Business Strategy** (3 Credits)\n   - **Course Role:** Capstone project course for the STEM MBA program.\n   - **Description:** Introduces business strategy integrated with data-driven decision-making. The course involves a major team-based analytics project with an organizational sponsor, combining technical analytical skills with strategic thinking to formulate and implement business strategies.\n\n2. **OBC 505: Teaming and Organizing for Innovation** (3 Credits)\n   - **Course Role:** Organizational behavior & teamwork foundation.\n   - **Description:** Explores how to navigate complex human systems and foster innovation within organizations. Topics include managing cross-cultural and multi-disciplinary teams, resolving conflict, negotiating change, and analyzing organizational dynamics that support innovative work.\n\n---\n\n*(Note: While the standard MBA program requires BUS 599 as its single capstone course, the MBA in Analytics specifically requires the two-course combination of **BUS 594** and **OBC 505**).*", "reference": "Capstone: OBC 505, BUS 594", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q041", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['program_search', 'business_school_database']; acceptable ['program_search', 'business_school_database']", "question": "How many optional specialties do I need to complete for the MBA in Analytics?", "answer": "According to the Business School database, for the **MBA in Analytics (Master of Business Administration)**:\n\nYou need to complete **2 optional specialties** (each requiring **3 courses**).\n\n---\n\n### Available Optional Specialties to Choose From:\n\n1. **Applied Business Analytics** (3 courses required)\n   * Courses include: `FIN 540`, `MIS 584`, `MIS 587`, `MKT 568`, `OIE 552`\n2. **Data-driven Strategic Management** (3 courses required)\n   * Courses include: `BUS 546`, `ETR 593`, `MIS 576`, `MKT 569`\n3. **Marketing Analytics** (3 courses required)\n   * Requires `MKT 568` plus 2 courses from `MKT 561`, `MKT 562`, `MKT 565`\n4. **Operations Analytics** (3 courses required)\n   * Courses include: `OIE 501`, `OIE 542`, `OIE 544`, `OIE 548`, `OIE 549`\n\n*(In addition to these 2 optional specialties, you must also complete the 2 required specialties: the 4 core courses and the 2-course capstone requirement).*", "reference": "2 optional specialties.", "tools": ["program_search", "business_school_database"]}, {"id": "q042", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the core courses for the MBA?", "answer": "According to the WPI Business School database, WPI offers two MBA degree tracks: the standard **Master of Business Administration (MBA)** and the **MBA in Analytics**. The required core courses for each program are outlined below:\n\n---\n\n### 1. Master of Business Administration (MBA)\n\n#### **MBA Core Courses (5 courses / 15 credits)**\n* **FIN 500**: Financial Management\n* **MIS 584**: Business Intelligence\n* **MKT 500**: Marketing Strategy\n* **OBC 506**: Leadership\n* **OIE 501**: Operations Management\n\n*(Note: Students with sufficient coursework or expertise in these areas may petition to substitute a more advanced course.)*\n\n#### **Other Required Courses (2 courses / 6 credits)**\n* **Integrative Business Foundation**: **BUS 590** (Strategic Management)\n* **Capstone**: **BUS 599** (Capstone Project)\n\n---\n\n### 2. MBA in Analytics\n\n#### **Core Courses (4 courses / 12 credits)**\n* **FIN 500**: Financial Management\n* **MIS 502**: Data Management for Analytics\n* **MKT 500**: Marketing Strategy\n* **OIE 501**: Operations Management\n\n#### **Capstone Requirement (2 courses / 6 credits)**\n* **BUS 594**\n* **OBC 505**\n\n---\n\n### Which track are you enrolled in or planning to pursue?\nIf you are already enrolled and have your degree progress in mind, you can share your program track or upload your transcript using the paperclip icon so we can review your degree requirements and remaining courses.", "reference": "Core: BUS 590, MIS 584, FIN 500, OBC 506, MKT 500, OIE 501", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q043", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the capstone requirements for the MBA?", "answer": "According to the WPI Business School database and graduate catalog, the capstone requirements depend on which MBA track you are enrolled in:\n\n---\n\n### 1. Master of Business Administration (Traditional MBA)\nFor the standard **Master of Business Administration**, the Capstone specialty requires **1 course** (3 credits):\n\n* **BUS 599: Capstone Project** (3 credits)\n  * **Description:** Integrates management theory and practice across the MBA curriculum through a major team-based project (a corporate venture or greenfield venture). Includes a written report and formal presentation to a panel of external experts and investors.\n  * **Prerequisites:** BUS 590 (Strategic Management), FIN 500, MIS 584, MKT 500, OBC 506, and OIE 501 (or equivalent content / instructor consent). *Note: BUS 590 serves as the Integrative Business Foundation course and must be completed prior to BUS 599.*\n\n---\n\n### 2. MBA in Analytics (STEM MBA)\nFor the **MBA in Analytics**, the Capstone specialty requires **2 courses** (6 credits total):\n\n* **BUS 594: Data-driven Business Strategy** (3 credits)\n  * **Description:** The capstone project course for the STEM MBA program. It connects business strategy formulation with data-driven decision-making and involves a major team-based analytics project with an organizational sponsor.\n* **OBC 505: Teaming and Organizing for Innovation** (3 credits)\n  * **Description:** Explores human systems, cross-cultural and multidisciplinary team management, organizational dynamics, conflict resolution, and leadership in innovative environments.\n\n---\n\n*(If you have already matriculated and would like to review which capstone or prerequisite requirements you have completed, feel free to upload your transcript using the paperclip icon!)*", "reference": "Capstone: BUS 599", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q044", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'program_search', 'business_school_database', 'pdf_context', 'semantic_search', 'semantic_search']; acceptable ['program_search', 'business_school_database']", "question": "How many optional specialties do I need to complete for the MBA?", "answer": "According to the WPI Graduate Business School Catalog, for the **Master of Business Administration (MBA)** program:\n\nYou are required to complete **one (1) specialty** (composed of **3 courses / 9 credits**).\n\n---\n\n### MBA Curriculum Structure Overview (36 Credits / 12 Courses)\n\n1. **Required Core Courses (5 courses / 15 credits):**\n   * **FIN 500** – Financial Management\n   * **MIS 584** – Business Intelligence\n   * **MKT 500** – Marketing Strategy\n   * **OBC 506** – Leadership\n   * **OIE 501** – Operations Management\n\n2. **MBA Specialty (1 specialty / 3 courses / 9 credits):**\n   You select **one** 3-course specialty from the approved options, which include:\n   * Advanced Business Analytics Methods\n   * Advanced Operations Analytics\n   * Applied Analytics\n   * Artificial Intelligence in Business\n   * Brand, Products, and Consumers\n   * Business Analytics\n   * Data Analytics\n   * Digital Transformation\n   * Entrepreneurship\n   * Information Systems Design\n   * Information Technology\n   * Information Technology User Experience\n   * Marketing Analytics\n   * Operational Excellence\n   * Operations Analytics\n   * Organizing and Managing Innovation\n   * Product Management\n   * Project Management\n   * Supply Chain Management\n   * System Design for IUX\n\n3. **Elective Courses (2 courses / 6 credits):**\n   * Must be graduate-level courses within the Business School.\n\n4. **Integrative STEM Course (1 course / 3 credits):**\n   * **BUS 590** – Strategic Management\n\n5. **Capstone Course (1 course / 3 credits):**\n   * **BUS 599** – Capstone Project\n\n*(Note: While certain Master of Science programs like the MSBA or MSIT require students to complete two specialties, the MBA program requires only **one**.)*", "reference": "3 optional specialties.", "tools": ["business_school_database", "program_search", "business_school_database", "pdf_context", "semantic_search", "semantic_search"]}, {"id": "q045", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the core courses for MSBA?", "answer": "According to the WPI Business School database, the **Master's in Business Analytics (MSBA) : Master of Science** program requires **3 core courses**:\n\n### **MSBA Core Courses (3 courses / 9 credits)**\n1. **MIS 502** – Data Management for Analytics (3 credits)\n2. **MIS 584** – Business Intelligence (3 credits)\n3. **OIE 552** – Modeling and Optimizing Processes (3 credits)\n\n---\n\n### **Additional Required Courses (Capstone)**\nIn addition to the 3 core courses, the MSBA program requires completion of a **2-course Capstone sequence**:\n* **BUS 596** – Capstone Project\n* **OBC 505** – Teaming and Organizing for Innovation\n\n*(Together, these make up the 5 required courses for the degree. To complete the degree, students also choose 2 optional specialties of 3 courses each.)*", "reference": "Core: MIS 502, MIS 584, OIE 552", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q046", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the capstone requirements for MSBA?", "answer": "According to the Business School database, the Capstone requirement for the **Master's in Business Analytics (MSBA)** requires the completion of **2 courses** (6 credits total):\n\n---\n\n### **1. BUS 596 – Master of Science Capstone Project** (3 Credits)\n* **Focus**: This course serves as the culminating capstone for STEM-based specialty MS programs in the Business School. It integrates the technical and analytical tools, methodologies, and business theories learned throughout the program. \n* **Structure**: Students work on a major team-based project addressing an actual corporate STEM-based business need, produce a formal written report providing technical, financial, and organizational rationale, and present their findings to project sponsors.\n\n---\n\n### **2. OBC 505 – Teaming and Organizing for Innovation** (3 Credits)\n* **Focus**: This course explores navigating complex human systems, fostering innovation, and managing cross-cultural and multi-disciplinary teams.\n* **Structure**: Students examine dynamic organizational challenges, team conflicts, ambiguity, and influence networks to effectively organize and execute innovative project work.", "reference": "Capstone: OBC 505, BUS 596", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q047", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database']; acceptable ['program_search', 'business_school_database']", "question": "How many optional specialties do I need to complete for MSBA?", "answer": "According to the Business School database, for the **Master's in Business Analytics (MSBA)** program, you are required to complete **2 optional specialties** (comprising 3 courses each, for a total of 6 courses).\n\nYou can choose your 2 specialties from the following available options:\n\n1. **Specialty in Advanced Business Analytics Methods** (3 courses)\n2. **Specialty in Artificial Intelligence in Business** (3 courses)\n3. **Specialty in Marketing Analytics** (3 courses)\n4. **Specialty in Operations Analytics** (3 courses)\n\n*(Note: In addition to these 2 optional specialties, you must also complete the 2 required specialties: the 3 core courses and the 2-course capstone requirement).*", "reference": "2 optional specialties.", "tools": ["business_school_database"]}, {"id": "q048", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the core courses for the MS in FinTech?", "answer": "According to the Business School database and graduate catalog, the required core curriculum for the **Master's in Financial Technology (FinTech)** consists of the following courses:\n\n---\n\n### **Required Core Courses (3 courses / 9 credits)**\n* **FIN 510** – *Business Applications of Blockchain Technology* (3 credits)\n* **FIN 530** – *Cryptocurrencies and Financial Markets* (3 credits)\n* **FIN 540** – *Financial Analytics* (3 credits)\n\n---\n\n### **Required Capstone Experience (2 courses / 6 credits)**\nIn addition to the FinTech core courses above, all MS in FinTech students are required to complete the capstone sequence:\n* **OBC 505** – *Teaming and Organizing for Innovation* (3 credits)\n* **BUS 596** – *Master of Science Capstone Project* (3 credits)\n\n---\n\n### **Program Context**\nBeyond these 5 required courses (15 credits), the degree requires completing **two 3-course specialties** (18 credits) chosen from:\n1. **Specialty in Advanced Financial Mathematics**\n2. **Specialty in FinTech Analytics**\n3. **Specialty in FinTech Development**\n\n*(Note: On-campus international students are also encouraged to complete up to 3 additional credits of internship).*", "reference": "Core: FIN 510, FIN 530, FIN 540", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q049", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the capstone requirements for the MS in FinTech?", "answer": "According to the WPI Business School database, the Capstone requirement for the **Master's in Financial Technology (FinTech)** consists of **2 required courses (6 credits total)**:\n\n1. **BUS 596 – Master of Science Capstone Project** (3 credits)\n   * **Description**: This is the culminating practical capstone course for STEM-based MS programs in the Business School. It integrates the STEM-based tools, technical skills, and business theories learned throughout your program through a major team-based project solving an actual corporate business need. It includes a comprehensive written report and a formal presentation to project sponsors.\n\n2. **OBC 505 – Teaming and Organizing for Innovation** (3 credits)\n   * **Description**: Explores navigating complex human systems and fostering innovation within organizations. Topics include managing cross-cultural and multidisciplinary teams, overcoming organizational and team conflict, negotiating change, and analyzing organizational dynamics that enable productive, innovative work.\n\nBoth courses must be completed to satisfy the capstone requirement of the degree.", "reference": "Capstone: OBC 505, BUS 596", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q050", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'program_search']; acceptable ['program_search', 'business_school_database']", "question": "How many optional specialties do I need to complete for the MS in FinTech?", "answer": "According to the Business School database, you are required to complete **2 optional specialties** (consisting of 3 courses each, for a total of 6 courses) for the Master's in Financial Technology (FinTech).\n\nYou can choose your 2 specialties from the following 3 options:\n\n1. **Specialty in Advanced Financial Mathematics** (3 courses)\n   - 1 course from: MIS 520, MIS 587\n   - 2 courses from: MA 571, MA 572, MA 573, MA 574, MA 575\n2. **Specialty in FinTech Analytics** (3 courses)\n   - 1 course from: MIS 520, MIS 587\n   - 2 courses from: DS 502, DS 503, DS 541, MIS 502, MIS 571\n3. **Specialty in FinTech Development** (3 courses)\n   - 1 course from: MIS 520, MIS 587\n   - 2 courses from: CS 5007, CS 5008, CS 5084, CS 513, CS 528 *(Note: CS 535 is recommended for students who have taken CS 5007, CS 5008, or equivalent)*", "reference": "2 optional specialties.", "tools": ["business_school_database", "program_search"]}, {"id": "q051", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the core courses for MSIT?", "answer": "According to the WPI Business School database and graduate catalog, the **Master’s in Information Technology (MSIT)** program requires **5 specific required courses** (15 credits) across two required categories:\n\n---\n\n### 1. MSIT Core Courses (3 courses / 9 credits)\nAll MSIT students must complete the following 3 core courses:\n* **MIS 502:** Data Management for Analytics (3 credits)\n* **MIS 581:** Policy and Strategy for Information Technology, Artificial Intelligence, and Analytics (3 credits)\n* **MIS 584:** Business Intelligence (3 credits)\n\n---\n\n### 2. Capstone Project Experience (2 courses / 6 credits)\nIn addition to the core courses, students must complete the required capstone sequence:\n* **MIS 573:** System Design and Development (3 credits)\n* **OBC 505:** Teaming and Organizing for Innovation (3 credits)\n\n---\n\n### Additional Degree Requirements Overview\nTo complete the degree, students also select **2 optional specialties** (3 courses / 9 credits each, for a total of 6 courses / 18 credits) from options such as:\n* Artificial Intelligence in Business\n* Data Analytics\n* Digital Transformation\n* Information Systems Design\n* IT User Experience", "reference": "Core: MIS 581, MIS 584, MIS 502", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q052", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the capstone requirements for MSIT?", "answer": "According to the Business School database, the **Capstone requirement** for the Master's in Information Technology (MSIT) program consists of **2 required courses** (6 credits total):\n\n1. **MIS 573: System Design and Development** (3 credits)\n   * **Focus:** Covers systems analysis and design principles, the systems development life cycle (SDLC) from project planning and requirements specification through system architecture and implementation, along with a hands-on, real-world systems analysis and design project.\n\n2. **OBC 505: Teaming and Organizing for Innovation** (3 credits)\n   * **Focus:** Explores how to navigate complex organizational dynamics, foster innovation, lead cross-cultural and multidisciplinary teams, manage conflict, and negotiate change within innovative organizations.\n\nBoth courses must be completed to satisfy the MSIT Capstone specialty requirement.", "reference": "Capstone: OBC 505, MIS 573", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q053", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database']; acceptable ['program_search', 'business_school_database']", "question": "How many optional specialties do I need to complete for MSIT?", "answer": "According to the Business School database, you need to complete **2 optional specialties** (3 courses each, for a total of 6 courses) for the Master's in Information Technology (MSIT) program.\n\n---\n\n### Available Optional Specialties (Choose 2):\n1. **Artificial Intelligence in Business** (3 courses)\n2. **Data Analytics** (3 courses)\n3. **Digital Transformation** (3 courses)\n4. **IT User Experience** (3 courses)\n5. **Information Systems Design** (3 courses)\n\n---\n\n### Program Structure Summary:\n* **Required Core & Capstone:** 5 courses total\n  * *Core Courses:* MIS 502, MIS 581, MIS 584 (3 courses)\n  * *Capstone:* MIS 573, OBC 505 (2 courses)\n* **Optional Specialties:** 2 specialties (6 courses total)\n* **Total Courses Required:** 11 courses", "reference": "2 optional specialties.", "tools": ["business_school_database"]}, {"id": "q054", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the core courses for the MS in Operations & Supply Chain Analytics?", "answer": "According to the Business School database and graduate catalog, the **Master’s in Operations & Supply Chain Analytics (MSOSCA)** requires **3 core courses** (9 credits total):\n\n| Course Code | Course Title | Credits | Description Overview |\n| :--- | :--- | :---: | :--- |\n| **OIE 501** | Operations Management | 3 | Focuses on data-driven decision-making to match supply with demand, emphasizing operational strategy, competitiveness, sustainability, and descriptive/predictive/prescriptive analytical techniques. |\n| **OIE 544** | Supply Chain Analysis and Design | 3 | Covers decisions, strategies, and analytical methods (such as linear programming and decision trees) used to design, evaluate, and manage supply chains. |\n| **OIE 552** | Modeling and Optimizing Processes | 3 | Provides quantitative tools and techniques for modeling, evaluating, and optimizing operational processes, primarily using spreadsheet models to guide business decisions. |\n\n---\n\n### Additional Program Requirements Overview\nBeyond the 3 core courses, the degree curriculum requires:\n- **Capstone Experience (2 courses / 6 credits):**\n  - **OBC 505:** Teaming and Organizing for Innovation\n  - **OIE 597:** Operations and Supply Chain Consulting Project\n- **Two Specialties (6 courses / 18 credits total):** Chosen from:\n  - Specialty in Supply Chain Management\n  - Specialty in Advanced Operations Analytics\n  - Specialty in Operational Excellence", "reference": "Core: OIE 501, OIE 544, OIE 552", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q055", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the capstone requirements for the MS in Operations & Supply Chain Analytics?", "answer": "According to the WPI Business School database, the **Master’s in Operations & Supply Chain Analytics** requires completion of a **2-course Capstone requirement** (6 credits total):\n\n---\n\n### **Capstone Course Requirements**\n\n1. **OBC 505 – Teaming and Organizing for Innovation** (3 credits)\n   * **Focus:** Navigating complex human systems in organizations, fostering innovation, managing multi-disciplinary and cross-cultural teams, handling ambiguity, and analyzing individual, team, and organizational dynamics.\n\n2. **OIE 597 – Operations and Supply Chain Consulting Project** (3 credits)\n   * **Focus:** Practical integration of operations and supply chain theories, practices, and analytical tools. Students work on a major team-based consulting project sponsored by an external organization, culminating in a written report and a formal presentation to project sponsors.\n\n---\n\n### **Program Context**\nThe Capstone requirement is one of the two mandatory specialties required for graduation in this program:\n* **Capstone:** 2 courses (`OBC 505`, `OIE 597`)\n* **Core Courses:** 3 courses (`OIE 501`, `OIE 544`, `OIE 552`)\n* **Optional Specialties:** Plus 2 specialties (3 courses each) chosen from *Advanced Operations Analytics*, *Operational Excellence*, or *Supply Chain Management*.", "reference": "Capstone: OBC 505, OIE 597", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q056", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'program_search']; acceptable ['program_search', 'business_school_database']", "question": "How many optional specialties do I need to complete for the MS in Operations & Supply Chain Analytics?", "answer": "According to the Business School database, you need to complete **2 optional specialties** (3 courses each, for a total of 6 courses) for the **Master’s in Operations & Supply Chain Analytics**.\n\n---\n\n### Available Optional Specialties (Choose 2):\n\n1. **Specialty in Advanced Operations Analytics** (3 courses)\n   * Courses include: `MIS 520`, `MIS 587`, `MKT 562`, `OIE 542`, `OIE 548`\n\n2. **Specialty in Operational Excellence** (3 courses)\n   * Sub-requirement 1 (1 course): `OIE 554` or `OIE 558`\n   * Sub-requirement 2 (2 courses): `FIN 500`, `MIS 576`, `OBC 537`, `OIE 554`, `OIE 558`\n\n3. **Specialty in Supply Chain Management** (3 courses)\n   * Sub-requirement 1 (1 course): `OIE 549` or `OIE 553`\n   * Sub-requirement 2 (2 courses): `MKT 561`, `OBC 533`, `OIE 548`, `OIE 549`, `OIE 553`\n\n---\n\n### Degree Overview Summary:\n* **Core Courses:** 3 courses (`OIE 501`, `OIE 544`, `OIE 552`)\n* **Capstone Requirement:** 2 courses (`OBC 505`, `OIE 597`)\n* **Optional Specialties:** 2 specialties (6 courses total)\n* **Total Program Requirements:** 11 courses (33 credits)", "reference": "2 optional specialties.", "tools": ["business_school_database", "program_search"]}, {"id": "q057", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the FinTech Analytics specialty in the MS in FinTech?", "answer": "According to the Business School database, the **FinTech Analytics** specialty in the **Master's in Financial Technology (FinTech)** program requires completing **3 courses** (9 credits) chosen from two groups:\n\n---\n\n### **1. Core Analytics / AI Requirement (Choose 1 course):**\n* **MIS 520** – Artificial Intelligence and its Business Applications\n* **MIS 587** – Business Applications in Machine Learning\n\n---\n\n### **2. Analytics Electives (Choose 2 courses):**\n* **DS 502** – Statistical Methods for Machine Learning *(cross-listed with MA 543)*\n* **DS 503** – Big Data Management *(cross-listed with CS 585)*\n* **DS 541** – Deep Learning *(cross-listed with CS 541)*\n* **MIS 502** – Data Management for Analytics\n* **MIS 571** – Database Applications Design and Development\n\n---\n\n*Note: If you have questions about prerequisites or scheduling for any specific course, please let me know!*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "FinTech Analytics (Master's in Financial Technology (FinTech)): MIS 520, MIS 587, DS 502, MIS 502, DS 503, DS 541, OIE 559, MIS 584, MIS 571", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q058", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Applied Business Analytics specialty in the MBA in Analytics?", "answer": "According to the Business School database and graduate catalog, the **Applied Business Analytics** specialty in the **MBA in Analytics** program requires you to complete **3 courses (9 credits)** chosen from the following 5 options:\n\n* **FIN 540:** Financial Analytics (3 credits)\n* **MIS 584:** Business Intelligence (3 credits)\n* **MIS 587:** Business Applications in Machine Learning (3 credits)\n* **MKT 568:** Marketing Analytics (3 credits)\n* **OIE 552:** Modeling and Optimizing Processes (3 credits)\n\n---\n\n### Program Context:\nIn the **MBA in Analytics**, you must complete **2 optional specialties** (3 courses each) in addition to your required core courses (`FIN 500`, `MIS 502`, `MKT 500`, and `OIE 501`) and capstone sequence (`BUS 594` and `OBC 505`).\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Applied Business Analytics (MBA in Analytics : Master of Business Administration): FIN 540, MIS 584, MIS 587, MKT 568, OIE 552", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q059", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Supply Chain Management specialty in the MBA?", "answer": "According to the Business School database, for the **Master of Business Administration (MBA)**, the **Supply Chain Management** optional specialty requires completing **2 courses** selected from the following options:\n\n* **MKT 561** – Consumer Behavior and Analytics\n* **OBC 533** – Negotiations\n* **OIE 533** \n* **OIE 548** – Performance Analytics\n* **OIE 549** – Sustainable Supply Chain and Operations Management\n\n---\n\n*(Note: If you are enrolled in the **MBA in Analytics** program rather than the standard MBA, please note that it offers an **Operations Analytics** specialty instead, which focuses on courses such as OIE 501, OIE 542, OIE 544, OIE 548, and OIE 549).*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Supply Chain Management (Master of Business Administration): OIE 553, OIE 549, MKT 561, OBC 533, OIE 533, OIE 548", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q060", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Advanced Financial Mathematics specialty in the MS in FinTech?", "answer": "According to the Business School database, the **Specialty in Advanced Financial Mathematics** within the Master's in Financial Technology (FinTech) requires completing **3 courses** (9 credits), divided across two categories:\n\n---\n\n### **1. Advanced Financial Mathematics – Part 1** *(Choose 1 course)*\n* **MIS 520**: Artificial Intelligence and its Ethical Applications in Business (3 credits)\n* **MIS 587**: Business Applications in Machine Learning (3 credits)\n\n---\n\n### **2. Advanced Financial Mathematics – Part 2** *(Choose 2 courses)*\nSelect any two of the following Mathematical Sciences courses:\n* **MA 571**: Financial Mathematics I (3 credits)\n* **MA 572**: Financial Mathematics II (3 credits)\n* **MA 573**: Numerical Methods in Financial Mathematics (3 credits)\n* **MA 574**: Portfolio Valuation and Risk Management (3 credits)\n* **MA 575**: Market and Credit Risk Models and Management (3 credits)\n\n---\n\n*(Note: FinTech students choose two specialties total across the program, alongside the required core courses and capstone).*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Advanced Financial Mathematics (Master's in Financial Technology (FinTech)): MIS 520, MIS 587, MA 571, MA 572, MA 573, MA 574, MA 575, MA 590", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q061", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Digital Transformation specialty in MSIT?", "answer": "According to the Business School database and graduate catalog, the **Specialty in Digital Transformation** within the Master's in Information Technology (MSIT) program requires **3 courses (9 credits)** structured as follows:\n\n---\n\n### **1. Required Course (Take 1 course)**\n* **MIS 500**: Innovating with Information Systems (3 credits)\n\n---\n\n### **2. Operations & Process Elective (Choose 1 course)**\n* **OIE 501**: Operations Management (3 credits)\n* **OIE 544**: Supply Chain Analysis and Design (3 credits)\n* **OIE 558**: Designing and Managing Lean Six Sigma Processes (3 credits)\n\n---\n\n### **3. Leadership & Project Elective (Choose 1 course)**\n* **MIS 576**: Project Management (3 credits)\n* **OBC 533**: Negotiations (3 credits)\n* **OBC 537**: Leading Change (3 credits)\n\n---\n\n*Note: In the MSIT curriculum, students complete two required specialties (the Core courses and Capstone) along with two optional specialties (such as Digital Transformation) of 3 courses each.*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Digital Transformation (Master's in Information Technology): MIS 500, OIE 501, OIE 544, OIE 558, MIS 576, OBC 533, OBC 537", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q062", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Operations Analytics specialty in MSBA?", "answer": "According to the WPI Business School database, to complete the **Operations Analytics** specialty in the **Master of Science in Business Analytics (MSBA)** program, you must choose **3 courses** (9 credits) from the following 5 eligible courses:\n\n### Eligible Courses for Operations Analytics Specialty\n\n* **OIE 501: Operations Management** (3 credits)  \n  *Focuses on data-driven decision-making to balance supply and demand within organizations and supply chains, exploring descriptive, predictive, and prescriptive analytical techniques.*\n\n* **OIE 542: Risk Management and Decision Making** (3 credits)  \n  *Covers decision-making under uncertainty, decision analysis methods, and applications to operations risk management and process improvement.*\n\n* **OIE 544: Supply Chain Analysis and Design** (3 credits)  \n  *Covers analytical methods, strategies, and frameworks for designing, evaluating, and managing supply chain performance and digital integration.*\n\n* **OIE 548: Performance Analytics** (3 credits)  \n  *Focuses on productivity management, benchmarking, relative efficiency measurement, and Data Envelopment Analysis (DEA) applied across various industries.*\n\n* **OIE 558: Designing and Managing Lean Six Sigma Processes** (3 credits)  \n  *Covers Lean Six Sigma as an organizational improvement system, statistical and process analysis tools, value-stream mapping, and project execution for operational excellence.*\n\n---\n*Note: In the MSBA degree structure, you must complete two 3-course specialties in addition to the core courses and capstone requirement.*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Operations Analytics (Master's in Business Analytics : Master of Science): OIE 501, OIE 542, OIE 544, OIE 548, OIE 558", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q063", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Marketing Analytics specialty in the MBA in Analytics?", "answer": "According to the WPI Business School database and graduate catalog, the **Marketing Analytics** specialty within the **MBA in Analytics** program requires a total of **3 courses (9 credits)**, structured into two parts:\n\n---\n\n### **1. Required Course (Must take 1 course)**\n* **MKT 568:** Marketing Analytics (3 credits)\n\n---\n\n### **2. Elective Courses (Choose 2 courses from the following)**\n* **MKT 561:** Consumer Behavior and Analytics (3 credits)\n* **MKT 562:** Marketing Research (3 credits)\n* **MKT 565:** Digital and Social Media Marketing (3 credits)\n\n---\n\n*(Note: In the MBA in Analytics program, students complete 2 optional specialties of 3 courses each, alongside the core and capstone requirements.)*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Marketing Analytics (MBA in Analytics : Master of Business Administration): MKT 568, MKT 561, MKT 562, MKT 565", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q064", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Marketing Analytics specialty in the MBA?", "answer": "According to the WPI Business School database, the courses you can take for the **Marketing Analytics** specialty depend slightly on whether you are enrolled in the **MBA in Analytics** or the standard **Master of Business Administration (MBA)**. \n\nBoth tracks require **3 courses** (9 credits) total, structured into two parts:\n\n---\n\n### 1. MBA in Analytics (Master of Business Administration)\n\n* **Part 1: Required Course (Take 1 course)**\n  * **MKT 568:** Marketing Analytics\n\n* **Part 2: Elective Courses (Choose 2 courses)**\n  * **MKT 561:** Consumer Behavior and Analytics\n  * **MKT 562:** Marketing Research\n  * **MKT 565:** Digital and Social Media Marketing\n\n---\n\n### 2. Master of Business Administration (MBA)\n\n* **Part 1: Required Course (Take 1 course)**\n  * **MKT 568:** Marketing Analytics\n\n* **Part 2: Elective Courses (Choose 2 courses)**\n  * **MKT 500:** Marketing Strategy *(Note: MKT 500 is also an MBA core requirement; if applied to core, select from the others)*\n  * **MKT 561:** Consumer Behavior and Analytics\n  * **MKT 565:** Digital and Social Media Marketing\n\n---\n\n*(If you have an uploaded transcript or know which specific MBA track you are pursuing, feel free to share and we can review your exact degree progress and course plan!)*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Marketing Analytics (Master of Business Administration): MKT 568, MKT 561, MKT 565, MKT 500", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q065", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Business Analytics specialty in the MBA?", "answer": "According to the Business School database, the specific requirements depend on whether you are enrolled in the standard **Master of Business Administration (MBA)** or the **MBA in Analytics**:\n\n---\n\n### 1. Master of Business Administration (MBA)\nFor the optional **Business Analytics** specialty, you must complete all **3 courses** (9 credits):\n\n* **MIS 502** – *Data Management for Analytics*\n* **MIS 584** – *Business Intelligence*\n* **OIE 552** – *Modeling and Optimizing Processes*\n\n*(Note: Depending on your plan of study, MIS 584 also satisfies one of the MBA core requirements. Those with sufficient coursework or expertise may petition to substitute a more advanced course.)*\n\n#### Closely Related Specialties in the MBA:\n* **Applied Analytics** (choose 3 courses):\n  * `DS 501`, `DS 502`, `MIS 502`, `MIS 584`, `MIS 587`\n* **Advanced Business Analytics Methods** (choose 3 courses):\n  * `MIS 587`, `MKT 562`, `OIE 559`\n\n---\n\n### 2. MBA in Analytics\nIf you are enrolled in the **MBA in Analytics** program, the corresponding concentration is the **Applied Business Analytics** specialty, which requires choosing **3 courses** from the following list:\n\n* **FIN 540** – *Financial Analytics*\n* **MIS 584** – *Business Intelligence*\n* **MIS 587** – *Advanced Business Analytics Methods*\n* **MKT 568** – *Data Mining Business Applications*\n* **OIE 552** – *Modeling and Optimizing Processes*\n\n---\n\n*If you would like to verify which program track you are on or review which courses you have already completed, feel free to upload your transcript or share your current degree track!*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Business Analytics (Master of Business Administration): MIS 584, MIS 502, OIE 552", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q066", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Information Systems Design specialty in MSIT?", "answer": "According to the Business School database, to complete the **Specialty in Information Systems Design** in the Master's in Information Technology (MSIT) program, you must take all **3 courses** (9 credits) listed below:\n\n---\n\n### **Required Specialty Courses**\n\n1. **MIS 571: Database Applications Design and Development** (3 Credits)\n   * **Focus**: Introduces theory and practice of computer-based data management, data quality, database system design for organizational data analytics, data security, integrity, and backup/recovery procedures. Includes hands-on database design and implementation.\n\n2. **MIS 582: Information Security Management** (3 Credits)\n   * **Focus**: Covers managerial-level information security fundamentals and explores the Common Body of Knowledge (CBK) of information security. Prepares managers to understand enterprise security risks, policies, and the vital role of security in modern organizations.\n\n3. **MIS 585: User Experience Design** (3 Credits)\n   * **Focus**: Emphasizes best practices in designing user-centered products and service experiences. Students complete hands-on projects developing practical skills in UX/UI, visual, service, and product design while learning to demonstrate business value.\n\n---\n\n### **MSIT Specialty Requirements Context**\n* In the MSIT curriculum, students must choose and complete **two optional specialties** (3 courses each) in addition to the required Core courses (`MIS 502`, `MIS 581`, `MIS 584`) and the Capstone requirement (`MIS 573`, `OBC 505`).\n* Completing `MIS 571`, `MIS 582`, and `MIS 585` fulfills one of your two chosen specialties.\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Information Systems Design (Master's in Information Technology): MIS 571, MIS 582, MIS 585", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q067", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Artificial Intelligence in Business specialty in MSBA?", "answer": "According to the Business School database, completing the **Specialty in Artificial Intelligence in Business** within the **Master's in Business Analytics (MSBA)** program requires **3 courses** (9 credits), selected across three specific categories:\n\n---\n\n### **1. Category 1 (Choose 1 course - Required)**\n* **MIS 587**: Business Applications in Machine Learning *(3 credits)*\n\n---\n\n### **2. Category 2 (Choose 1 course)**\n* **MIS 520**: Artificial Intelligence and its Business Applications *(3 credits)*\n* **MIS 581**: Policy and Strategy for Information Technology, Artificial Intelligence, and Analytics *(3 credits)*\n\n---\n\n### ** mputer Science with Data Structures and Algorithms (3 credits)\n* **CS 5008**: Introduction to Systems and Network Programming (3 credits)\n* **CS 5084**: Introduction to Algorithms: Design and Analysis (3 credits)\n* **CS 513**: Computer Networks (3 credits)\n* **CS 528**: Mobile and Ubiquitous Computing (3 credits)\n\n---\n\n### **Advising Note**\n* For students who have already completed **CS 5007**, **CS 5008**, or equivalent foundational coursework, taking more advanced coursework such as **CS 535** (or **CS 528**) is recommended.\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "FinTech Development (Master's in Financial Technology (FinTech)): MIS 520, MIS 587, CS 5007, CS 5008, CS 5084, CS 513, CS 528, CS 573, CS 578, MIS 583", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q069", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Operations Analytics specialty in the MBA in Analytics?", "answer": "According to the WPI Business School database, to complete the **Operations Analytics** specialty in the **MBA in Analytics** program, you must choose **3 courses** from the following list:\n\n* **OIE 501**: Operations Management (3 credits)\n* **OIE 542**: Risk Management and Decision Making (3 credits)\n* **OIE 544**: Supply Chain Analysis and Design (3 credits)\n* **OIE 548**: Performance Analytics (3 credits)\n* **OIE 549**: Sustainable Supply Chain and Operations Management (3 credits)\n\n---\n\n### Important Academic Advising Note:\n* **OIE 501** is also listed as one of the 4 required core courses in the MBA in Analytics curriculum (along with FIN 500, MIS 502, and MKT 500). \n* Since core courses generally cannot double-count toward fulfilling elective/specialty requirements, students typically select **three of the remaining courses** (**OIE 542, OIE 544, OIE 548, OIE 549**) to complete the specialty. Please confirm your specific course plan with your academic advisor.\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Operations Analytics (MBA in Analytics : Master of Business Administration): OIE 501, OIE 542, OIE 544, OIE 548, OIE 558, OIE 549", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q070", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the IT User Experience specialty in MSIT?", "answer": "According to the Business School database and graduate course catalog, the **Specialty in IT User Experience** in the Master's in Information Technology (MSIT) program requires **3 courses** (9 credits total). \n\nTo complete this specialty, you must take the following three courses:\n\n---\n\n### **Required Courses for IT User Experience Specialty**\n\n1. **MIS 583: User Experience Applications** (3 Credits)\n   - **Overview:** Provides an introduction to UX methods to evaluate user experiences of technological products and services. Students learn to use modern research tools, such as eye tracking and emotion detection, combining theoretical concepts with practical, hands-on projects and exercises.\n\n2. **MIS 586: User Experience Methods** (3 Credits)\n   - **Overview:** Focuses on qualitative and quantitative research methodologies in the UX field across academia and industry. Topics include surveys, persona development, customer journey mapping, and industry-standard tools for assessing user interaction and designing effective digital products.\n\n3. **MKT 561: Consumer Behavior and Analytics** (3 Credits)\n   - **Overview:** Explores consumer behavior theory and the practical application of consumer data and analytics in the digital age. Prepares students to analyze digital traces of consumer activity to inform strategic business decisions and customer engagement.\n\n---\n\n### **MSIT Degree Structure Note**\nIn the MSIT curriculum, students must complete:\n- **Core Requirements:** 3 courses (`MIS 502`, `MIS 581`, `MIS 584`)\n- **Capstone Requirement:** 2 courses (`MIS 573`, `OBC 505`)\n- **Specialties:** 2 optional specialties (3 courses each)\n\nChoosing the **IT User Experience** specialty fulfills one of your two optional specialty requirements.\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "IT User Experience (Master's in Information Technology): MIS 583, MIS 586, MKT 561", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q071", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Product Management specialty in the MBA?", "answer": "According to the database, the **Product Management** specialty is an optional specialty in the **Master of Business Administration (MBA)** curriculum. \n\nTo complete this specialty, you must take a total of **3 courses (9 credits)** divided into two groups:\n\n---\n\n### **1. Required Course (Select 1 course)**\nYou must take:\n* **MKT 569: Product Management** (3 credits)\n\n---\n\n### **2. Elective Courses (Select 2 courses)**\nChoose any **2 courses** from the following options:\n* **BUS 546: Managing Technological Innovation** (3 credits)\n* **ETR 593: Technology Commercialization** (3 credits)\n* **MIS 576: Project Management** (3 credits)\n* **MIS 583: User Experience Applications** (3 credits)\n* **MIS 585: User Experience Design** (3 credits)\n\n---\n\n*(Note: If you are enrolled in the **MBA in Analytics** program rather than the standard MBA, please note that the Product Management specialty is not one of its designated optional specialty tracks).*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Product Management (Master of Business Administration): MKT 569, BUS 546, ETR 593, MIS 576, MIS 583, MIS 585, MKT 565, OBC 535, OBC 533, OBC 505", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q072", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Advanced Operations Analytics specialty in the MBA?", "answer": "According to the Business School database and graduate catalog, the **Advanced Operations Analytics** specialty in the **Master of Business Administration (MBA)** requires **3 courses** (9 credits) distributed across two groups (ensuring at least two courses are from the Operations and Information Engineering [OIE] area):\n\n---\n\n### **1. Advanced Operations Analytics – Group 1**\n*(Choose **1 course**)*\n* **MIS 587** – Business Applications in Machine Learning (3 credits)\n* **MKT 562** – Marketing Research (3 credits)\n\n---\n\n### **2. Advanced Operations Analytics – Group 2**\n*(Choose **2 courses**)*\n* **OIE 542** – Risk Management and Decision Analysis (3 credits)\n* **OIE 548** – Performance Analytics (3 credits)\n* **OIE 559** – Advanced Prescriptive Analytics: From Data to Impact (3 credits)\n\n---\n\n*Note: If you have an uploaded transcript and want to see how your completed courses apply toward this specialty or MBA degree requirements, please let me know!*\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Advanced Operations Analytics (Master of Business Administration): MIS 587, MKT 562, OIE 559, OIE 548, OIE 542", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q073", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Brands, Products, & Consumers specialty in the MBA?", "answer": "According to the official Business School database, to complete the **Brands, Products, & Consumers** specialty in the **Master of Business Administration (MBA)** program, you must complete **3 courses** (9 credits) selected from the following list:\n\n### Course Options\n\n| Course Code | Course Title | Credits |\n| :--- | :--- | :---: |\n| **MKT 500** | Marketing Strategy | 3 |\n| **MKT 561** | Consumer Behavior and Analytics | 3 |\n| **MKT 562** | Marketing Research | 3 |\n| **MKT 565** | Digital and Social Media Marketing | 3 |\n| **MKT 568** | Marketing Analytics | 3 |\n\n*(Note: The academic catalog also lists **MKT 569: Product Management** under this area; however, the authoritative database specifies the five courses above. Always verify with your academic adviso 42, OIE 548, OIE 559, MIS 587, MKT 562, MIS 520", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q076", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Marketing Analytics specialty in MSBA?", "answer": "According to the Business School database, the **Specialty in Marketing Analytics** for the **Master of Science in Business Analytics (MSBA)** requires a total of **3 courses (9 credits)** structured across three categories:\n\n---\n\n### **1. Category 1: Foundational Marketing (Choose 1 course)**\n*Select one of the following:*\n* **MKT 500 – Marketing Strategy** (3 credits)\n* **MKT 561 – Consumer Behavior and Analytics** (3 credits)\n\n---\n\n### **2. Category 2: Digital Marketing (Required)**\n* **MKT 565 – Digital and Social Media Marketing** (3 credits)\n\n---\n\n### **3. Category 3: Analytics (Required)**\n* **MKT 568 – Marketing Analytics** (3 credits)\n\n---\n\n### **Summary of Completion Plan**\nTo complete this specialty, your coursework will look like:\n1. **MKT 500** *or* **MKT 561**\n2. **MKT 565**\n3. **MKT 568**\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Marketing Analytics (Master's in Business Analytics : Master of Science): MKT 500, MKT 561, MKT 565, MKT 568", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q077", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Artificial Intelligence in Business specialty in MSIT?", "answer": "According to the Business School database, the **Specialty in Artificial Intelligence in Business** for the Master's in Information Technology (MSIT) requires **3 courses (9 credits)** chosen across three requirement buckets:\n\n---\n\n### **1. AI in Business – Group 1 (Take 1 course)**\n* **MIS 587**: Business Applications in Machine Learning (3 credits)\n\n---\n\n### **2. AI in Business – Group 2 (Select 1 course)**\n* **MIS 520**: Artificial Intelligence and its Business Applications / Ethical Applications in Business (3 credits)  \n* **MIS 581**: Policy and Strategy for Information Technology, Artificial Intelligence, and Analytics (3 credits)  \n  *(Note: MIS 581 is also one of the required core courses for the MSIT program).*\n\n---\n\n### **3. AI in Business – Group 3 (Select 1 course)**\n* **MKT 562**: Marketing Research (3 credits)  \n* **MKT 568**: Marketing Analytics (3 credits)  \n* **OIE 552**: Modeling and Optimizing Processes (3 credits)\n\n**Note:** For personalized academic planning based on your transcript, please upload your PDF transcript to access your complete information.", "reference": "Artificial Intelligence in Business (Master's in Information Technology): MIS 587, MIS 520, MIS 581, MKT 562, MKT 568, OIE 552", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q078", "category": "specialty_courses", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "Which courses can I take for the Innova -listed with ECON 2910)*\n   * **Credits:** 3\n   * **Instructors:** Oleg Pavlov, Rosanna Garcia\n   * **Delivery / Location:** In-Person (Washburn 229)\n   * **Schedule:** M-R | 10:00 AM – 11:50 AM\n   * **Offered:** 2025 Fall B Term\n   * **Description:** An introduction to economics and entrepreneurship, exploring the linkages between the two fields and applying concepts to opportunity assessment.", "reference": "Rosanna Garcia teaches BUS 651, ETR 593.", "tools": ["business_school_database"]}, {"id": "q206", "category": "instructor_lookup", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['smart_course_search']", "question": "Which courses does Jim Ryan teach?", "answer": "According to the database, Jim Ryan teaches the following 6 courses across undergraduate and graduate levels:\n\n---\n\n### **Undergraduate Courses**\n\n1. **MIS 3720: Business Data Management**\n   - **Credits:** 3\n   - **Delivery Mode:** In-Person\n   - **Offered:** Spring 2026 (C Term)\n   - **Schedule & Location:** Mon/Thu 8:00 AM – 9:50 AM | Salisbury Labs 105\n   - **Description:** Introduces the theory and practice of database management and the application of database software to implement business information systems that support managerial and operational decision-making. Topics include relational data models, query languages, normalization, locking, concurrency control, and recovery.\n\n2. **MIS 4720: Systems Analysis and Design**\n   - **Credits:** 3\n   - **Delivery Mode:** In-Person\n   - **Offered:** Spring 2026 (D Term)\n   - **Schedule & Location:** Tue/Fri 10:00 AM – 11:50 AM | Washburn 323\n   - **Description:** Integrates students’ background in MIS in a project focusing on the development of creative solutions to open-ended business and manufacturing problems utilizing tools such as the systems development life cycle (SDLC), feasibility studies, cost-benefit analysis, and structured analysis and design.\n\n---\n\n### **Graduate Courses**\n\n3. **BUS 596: Master of Science Capstone Project**\n   - **Credits:** 3\n   - **Delivery Mode:** Hybrid\n   - **Offered:** Spring 2026 Semester\n   - **Schedule & Location:** Tue 6:00 PM – 8:50 PM | Salisbury Labs 105\n   - **Description:** Capstone course for STEM-based, specialty MS programs in the Business School, serving as a practical integration of STEM-based tools, techniques, and business theories through a major team-based corporate project.\n\n4. **MIS 502: Data Management for Analytics**\n   - **Credits:** 3\n   - **Delivery Mode:** In-Person\n   - **Offered:** Spring 2026 Semester\n   - **Schedule & Location:** Mon 1:00 PM – 3:50 PM | Gateway Park 1, Room 1002\n   - **Description:** Focuses on skills needed for handling data, including cleaning and preparing data for analysis, writing SQL queries to access and manipulate data, and addressing ethical uses of data and data privacy issues.\n\n5. **MIS 571: Database Applications Design and Development**\n   - **Credits:** 3\n   - **Delivery Mode:** Hybrid\n   - **Offered:** Fall 2025 Semester\n   - **Description:** Covers the theory and practice of computer-based data management, focusing on the design of database systems to meet an organization’s needs for data analytics, data security, integrity, quality, and backup/recovery procedures.\n\n6. **MIS 582: Information Security Management**\n   - **Credits:** 3\n   - **Delivery Mode:** Hybrid (Online-asynchronous)\n   - **Offered:** Fall 2025 Semester\n   - **Description:** Introduces the fundamentals of Information Security Management, developing an understanding of the importance of information security across enterprises and the role managers play in securing systems.", "reference": "Jim Ryan teaches BUS 596, MIS 3720, MIS 4720, MIS 502, MIS 571, MIS 582.", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q207", "category": "instructor_lookup", "metric": "tool_selection", "s  ['smart_course_search']", "question": "Which courses does Walter Towner teach?", "answer": "According to the Business School database, **Walter Towner** teaches the following 3 courses:\n\n---\n\n### 1. **OIE 2850: Engineering Economics**\n* **Credits:** 3\n* **Level:** Undergraduate\n* **Delivery:** In-Person\n* **Schedule & Location:** Spring 2026, D Term | Tuesday & Friday, 12:00 PM – 1:50 PM | Olin Hall 223\n* **Description:** Designed to aid all engineering students in understanding economics and business constraints on engineering decision-making. Topics include evaluation of alternatives, the six time-value-of-money factors, present worth, annual cash flow and rate-of-return analysis, incremental analysis, depreciation, income taxes, replacement analysis, and inflation.\n\n---\n\n### 2. **OIE 3020: Achieving Effective Operations**\n* **Credits:** 3\n* **Level:** Undergraduate\n* **Delivery:** In-Person\n* **Schedule & Location:** Spring 2026, C Term | Wednesday, 1:00 PM – 3:50 PM | Fuller Labs 311\n* **Description:** Examines operations embedded in a constantly changing network of relationships with stakeholders including customers and suppliers. Covers resource allocation (financial, human, technological) aligned with strategic goals, sustainability, and environmentally responsible practices.\n\n---\n\n### 3. **OIE 3420: Quality Planning, Design and Control**\n* **Credits:** 3\n* **Level:** Undergraduate\n* **Delivery:** In-Person\n* **Schedule & Location:** Spring 2026, C Term | Tuesday & Friday, 12:00 PM – 1:50 PM | Salisbury Labs 105\n* **Description:** Provides students with analytical and management tools necessary to solve manufacturing and service quality problems. Topics include customer needs, quality/cost relationships, process capability analysis, statistical process control (SPC), control charts for variables and attributes, design of experiments, and Six Sigma problem-solving methodologies.", "reference": "Walter Towner teaches OIE 2850, OIE 3020, OIE 3420.", "tools": ["business_school_database", "smart_course_search"]}, {"id": "q209", "category": "instructor_lookup", "metric": "tool_selection", "score": 0.0, "success": false, "reason": "called ['business_school_database']; acceptable ['smart_course_search']", "question": "Which courses does David Dwumah teach?", "answer": "According to the Business School database, David Dwumah teaches the following courses:\n\n---\n\n### 1. **FIN 3310 – Financial Markets and Digital Currencies**\n* **Level:** Undergraduate\n* **Credits:** 3\n* **Format / Delivery:** In-Person (Stratton Hall 202)\n* **Offering:** Fall 2025, A Term\n* **Schedule:** Monday – Thursday, 8:00 AM – 9:50 AM\n* **Description:** This course introduces students to financial innovations and digital assets transforming the banking and financial services sector, exposing students to strategic skills and analytical tools.\n\n---\n\n### 2. **FIN 530 – Cryptocurrencies and Financial Markets**\n* **Level:** Graduate\n* **Credits:** 3\n* **Format / Delivery:** In-Person (Stratton Hall 202)\n* **Offering:** Fall Semester 2025\n* **Schedule:** Monday – Thursday, 8:00 AM – 9:50 AM\n* **Description:** This course covers digital currencies and related FinTech topics. It begins with the study of the nature of money, legacy payment systems, and banking systems, followed by an examination of stateless, cloud-based digital currency systems.\n\n---\n\nIf you have questions about prerequisites or how these fit into your degree plan, feel free to ask!", "reference": "David Dwumah teaches FIN 3310, FIN 530.", "tools": ["business_school_database"]}, {"id": "q210", "category": "instructor_lookup", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search']; acceptable ['smart_course_search']", "question": "Which courses does Sara Saberi teach?", "answer": "According to the database, Professor Sara Saberi teaches the following courses:\n\n---\n\n### 1. M)\n* **Term Offered:** Spring 2026 D-Term\n* **Description:** Analyzes in-depth case studies in operations and industrial engineering, covering both manufacturing and service systems ranging from production system design to operations planning and control.\n\n---\n\n### 3. **OIE 548: Performance Analytics**\n* **Level:** Graduate (3 credits)\n* **Delivery:** Online (Asynchronous)\n* **Term Offered:** Spring 2026 Semester\n* **Description:** Covers productivity management and analysis techniques from engineering and management perspectives. Topics include benchmarking, production functions, and relative efficiency measurement using Data Envelopment Analysis (DEA).\n\n---\n\n### 4. **OIE 552: Modeling and Optimizing Processes**\n* **Level:** Graduate (3 credits)\n* **Delivery:** In-Person (Washburn 229 | Thursdays, 6:00 PM – 8:50 PM)\n* **Term Offered:** Fall 2025 Semester\n* **Description:** Provides quantitative tools and techniques useful in modeling, evaluating, and optimizing operation processes, with an emphasis on spreadsheet modeling to support industry and business decision-making.", "reference": "Joe Zhu teaches BUS 691, OIE 4410, OIE 548, OIE 552.", "tools": ["business_school_database"]}, {"id": "q213", "category": "instructor_lookup", "metric": "tool_selection", "score": 0.0, "success": false, "reason": "called ['business_school_database']; acceptable ['smart_course_search']", "question": "Which courses does Paul Delvy teach?", "answer": "According to the database, Paul Delvy teaches the following 3 courses:\n\n---\n\n### 1. **MIS 576: Project Management**\n* **Level:** Graduate\n* **Credits:** 3\n* **Delivery:** Online (Asynchronous)\n* **Offered:** Spring 2026 Semester\n* **Description:** This course presents the specific concepts, techniques, and tools for managing projects effectively. The role of the project manager as team leader is examined, together with important techniques for controlling cost, schedules, and performance parameters.\n\n---\n\n##
