ements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the capstone requirements for the MBA in Analytics?", "answer": "According to the WPI Business School database, the **MBA in Analytics** program requires **2 capstone courses** (6 credits total):\n\n1. **BUS 594: Data-driven Business Strategy** (3 credits)\n   * *Description:* This is the capstone project course for the STEM MBA program. It integrates business strategy with data-driven decision-making through a major team-based analytics project with an organizational sponsor, combining technical analytical skills with strategic business thinking.\n\n2. **OBC 505: Teaming and Organizing for Innovation** (3 credits)\n   * *Description:* This course explores how to navigate complex human systems, foster innovation, and manage the systemic dynamics, challenges, and opportunities of working across teams, networks, and innovative organizations.\n\nBoth courses are required to satisfy the Capstone specialty requirement for the MBA in Analytics degree.", "reference": "Capstone: OBC 505, BUS 594", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q041", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['program_search', 'business_school_database', 'business_school_database']; acceptable ['program_search', 'business_school_database']", "question": "How many optional specialties do I need to complete for the MBA in Analytics?", "answer": "According to the Business School database, for the **MBA in Analytics (Master of Business Administration)**, you need to complete:\n\n* **2 optional specialties** (each requiring **3 courses**, for a total of 6 elective/specialty courses).\n\n---\n\n### Available Optional Specialties for MBA in A gy\n* **OBC 506** – Leadership\n* **OIE 501** – Operations Management\n\n#### **Integrative Foundation & Capstone Requirements (2 courses):**\n* **BUS 590** – Integrative Business Foundation *(1 course)*\n* **BUS 599** – Capstone Project *(1 course)*\n\n> *Note: According to the database, students with sufficient coursework or expertise in these areas may petition to take a more advanced course.*\n\n---\n\n### 2. MBA in Analytics\n\nThe MBA in Analytics requires **6 required courses** across two categories:\n\n#### **Core Courses (4 courses):**\n* **FIN 500** – Financial Management\n* **MIS 502** – Data Management for Analytics\n* **MKT 500** – Marketing Strategy\n* **OIE 501** – Operations Management\n\n#### **Capstone Requirement (2 courses):**\n* **BUS 594** – Capstone\n* **OBC 505** – Teaming and Organizing for Innovation\n\n---\n\n*(Note: Your student context indicates an association with the MSIT program. If you are exploring a dual degree, considering a program change, or looking to take MBA courses as electives, please let me know so I can tailor course recommendations to your goals!)*", "reference": "Core: BUS 590, MIS 584, FIN 500, OBC 506, MKT 500, OIE 501", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q043", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the capstone requirements for the MBA?", "answer": "According to the WPI Business School database, the capstone requirements depend on whether you are referring to the traditional **Master of Business Administration (MBA)** or the STEM-designated **MBA in gning, developing, and utilizing business dashboards to monitor organizational performance and make data-driven decisions.*\n\n---\n\n### **2. Capstone Requirement (2 courses required)**\nIn addition to the core courses above, all MSIT students must complete the Capstone requirement:\n* **MIS 573 – System Design and Development** (3 credits)\n* **OBC 505 – Teaming and Organizing for Innovation** (3 credits)\n\n---\n\n### **Program Structure Summary**\n* **Required Courses:** 5 courses total (3 Core + 2 Capstone)\n* **Specialties:** Students also choose **2 optional specialties** (3 courses each, 6 courses total) from areas such as *Artificial Intelligence in Business*, *Data Analytics*, *Digital Transformation*, *IT User Experience*, or *Information Systems Design*.", "reference": "Core: MIS 581, MIS 584, MIS 502", "tools": ["business_school_database", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search", "smart_course_search"]}, {"id": "q052", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the capstone requirements for MSIT?", "answer": "According to the Business School database, the **Capstone** requirement for the **Master's in Information Technology (MSIT)** program requires students to complete **2 courses** (6 credits total):\n\n1. **MIS 573 – System Design and Development** (3 credits)\n   - *Overview:* Introduces the concepts and principles of systems analysis and design, covering all aspects of the systems development life cycle (SDLC) from project planning and management through system architecture, interface design, implementation, and change management.\n2. **OBC 505 – Teaming and Organizing for Innovation** (3 credits)\n   - *Overview:* Focuses on navigating complex human systems and fostering innovation within organizations, exploring teamwork, cross-cultural dynamics, and managing project-based networks.\n\nBoth of these courses are mandatory to satisfy the MSIT capstone requirement.", "reference": "Capstone: OBC 505, MIS 573", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q053", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database']; acceptable ['program_search', 'business_school_database']", "question": "How many optional specialties do I need to complete for MSIT?", "answer": "According to the Business School database, for the **Master's in Information Technology (MSIT)** program:\n\nYou need to complete **2 optional specialties** (each consisting of 3 courses, for a total of 6 courses).\n\n---\n\n### Summary of MSIT Requirements:\n* **Required Specialties (Must complete both – 5 courses total):**\n  * **Core Courses (3 courses):** MIS 502, MIS 581, MIS 584\n  * **Capstone (2 courses):** MIS 573, OBC 505\n\n* **Optional Specialties (Choose 2 – 3 courses each):**\n  * Specialty in Artificial Intelligence in Business\n  * Specialty in Data Analytics\n  * Specialty in Digital Transformation\n  * Specialty in IT User Experience\n  * Specialty in Information Systems Design", "reference": "2 optional specialties.", "tools": ["business_school_database"]}, {"id": "q054", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the core courses for the MS in Operations & Supply Chain Analytics?", "answer": "According to the Business School database, the **Master’s in Operations & Supply Chain Analytics** requires **3 core courses** (9 credits):\n\n* **OIE 501: Operations Management** (3 credits)  \n  Focuses on data-driven decision-making to match supply to demand, examining the strategic impact of operations on competitiveness, sustainability, and emergent technologies.\n* **OIE 544: Supply Chain Analysis and Design** (3 credits)  \n  Covers decisions, strategies, and analytical methods used in designing, evaluating, and managing supply chains and integrating digital technologies.\n* **OIE 552: Modeling and Optimizing Processes** (3 credits)  \n  Provides quantitative tools and spreadsheet modeling techniques to evaluate, model, and optimize business and operational processes for decision-making.\n\n---\n\n### Additional Required Specialty: Capstone Requirement\nIn addition to the 3 core courses, all students in this program must complete the **Capstone requirement (2 courses)**:\n* **OBC 505: Teaming and Organizing for Innovation**\n* **OIE 597: Capstone Project**\n\n*(Beyond these 5 required courses, students must complete 2 optional specialties of 3 courses each to fulfill graduation requirements).*", "reference": "Core: OIE 501, OIE 544, OIE 552", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q055", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'smart_course_search', 'smart_course_search']; acceptable ['program_search', 'business_school_database']", "question": "What are the capstone requirements for the MS in Operations & Supply Chain Analytics?", "answer": "According to the Business School database, the capstone requirement for the **Master’s in Operations & Supply Chain Analytics** consists of **2 required courses** (6 credits total):\n\n---\n\n### **Required Capstone Courses**\n\n1. **OBC 505: Teaming and Organizing for Innovation** (3 credits)\n   * **Focus**: Explores managing complex human systems, team dynamics, cross-cultural collaboration, and navigating challenges within innovative organizations.\n\n2. **OIE 597: Operations and Supply Chain Consulting Project** (3 credits)\n   * **Focus**: Serves as the practical, experiential capstone integrating operations and supply chain theories, practices, tools, and techniques learned throughout the program. Students complete a major team-based consulting project sponsored by an external organization.\n\n---\n\nBoth courses must be completed to satisfy the capstone requirement for the degree.", "reference": "Capstone: OBC 505, OIE 597", "tools": ["business_school_database", "smart_course_search", "smart_course_search"]}, {"id": "q056", "category": "program_requirements", "metric": "tool_selection", "score": 1.0, "success": true, "reason": "called ['business_school_database', 'program_search', 'business_school_database', 'student_context']; acceptable ['program_search', 'business_school_database']", "question": "How many optional specialties do I need to complete for the MS in Operations & Supply Chain Analytics?", "answer": "According to the Business School database, you are required to complete **2 optional specialties** (3 courses each, for a total of 6 courses) for the **Master’s in Operations & Supply Chain Analytics**.\n\n---\n\n### Program Structure: MS in Operations & Supply Chain Analytics\n\n1. **Required Specialties (Must complete both / 5 courses total):**\n   * **Core Courses (3 courses):**\n     * `OIE 501` Operations Management\n     * `OIE 544` Supply Chain Analysis and Design\n     * `OIE 552` Modeling and Optimizing Operations\n   * **Capstone (2 courses):**\n     * `OBC 505` Teaming and Organizing for Innovation\n     * `OIE 597` Operations and Supply Chain Capstone Project\n\n2. **Optional Specialties (Choose 2 / 3 courses each):**\n   * **Specialty in Advanced Operations Analytics**\n   * **Specialty in Operational Excellence**\n   * **Specialty in Supply Chain Management**\n\n---\n\n*(Note: Your message also mentioned **Program: MSIT**. For the **Master's in Information Technology (MSIT)** program, the structure is identic <script>
const D = JSON.parse(document.getElementById('data').textContent);

  const n = document.createElement(tag);

  return n;
};
const fmt = v => v == null ? '–' : (+v).toFixed(2);
const pct = v => v == null ? '–' : Math.round(v * 100) + '%';

document.getElementById('meta').append(
  'Run ', el('code', {}, S.run || ''), ' · judge ', el('code', {}, S.judge || ''), ' · generated ', D.generated);

const cards = document.getElementById('cards');
for (const key of ['tool_selection', 'faithfulness', 'answer_relevancy', 'correctness']) {

  const bar = el('div', {class: 'bar'}, el('span', {style: `width:${(m.mean || 0) * 100}%;background:${color(m.mean)}`}));
  cards.append(el('div', {class: 'card'},
    el('div', {class: 'name'}, D.labels[key] || key),
    el('div', {class: 'big'}, fmt(m.mean)),
    el('div', {class: 'sub'}, `${pct(m.pass_rate)} pass (≥ ${D.thresholds[key]}) · ${m.n} items` +
      (m.judge_errors ? ` · ${m.judge_errors} judge errors` : '')),
    bar, el('div', {class: 'help'}, D.help[key] || '')));
}
if (M.oos_refusal) {
  const r = M.oos_refusal;
  cards.append(el('div', {class: 'card'}, el('div', {class: 'name'}, 'Out-of-scope refusal'),

    el('div', {class: 'bar'}, el('span', {style: `width:${r.rate * 100}%;background:${color(r.rate)}`})),
    el('div', {class: 'help'}, 'Off-topic questions stopped by the intent gate.')));
}

// Category × metric heatmap
const metrics = ['correctness', 'faithfulness', 'answer_relevancy', 'tool_selection'].filter(k => M[k]);
const cats = [...new Set(D.rows.map(r => r.category))].sort();
const avg = (c, k) => { const v = D.rows.filter(r => r.category === c && r.metric === k && r.score != null).map(r => r.score);
                        return v.length ? {mean: v.reduce((a, b) => a + b, 0) / v.length, n: v.length} : null; };
const heat = el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Category'),
  ...metrics.map(k => el('th', {class: 'num'}, D.labels[k])))));

    return el('td', {class: 'heat', title: a ? `${a.n} items` : 'not scored'},
      a ? el('span', {class: 'pill ' + tone(a.mean, D.thresholds[k])}, fmt(a.mean)) : el('span', {class: 'na'}, '–'));
  })));
}
heat.append(hb);
document.getElementById('heat').append(heat);

// Judge agreement
if (S.judge_agreement) {

  const box = document.getElementById('agreement');

  const stat = (name, value, sub) => el('div', {class: 'card'}, el('div', {class: 'name'}, name),
    el('div', {class: 'big'}, value), el('div', {class: 'sub'}, sub));
  box.append(el('div', {class: 'agree'},
    stat('DeepEval mean', fmt(a.deepeval_mean), `${a.n} items scored by both`),
    stat('Gemini judge mean', fmt(a.gemini_judge_mean), 'same-family judge'),
    stat('Pearson r', a.pearson == null ? '–' : a.pearson.toFixed(2), 'noisy on small samples'),
    stat('Agree: fully supported', pct(a.fully_supported_agreement), 'same verdict on "every claim supported"')));
  box.append(el('p', {class: 'note'}, 'Where the judges disagree, read the item by hand: that is where a score is least trustworthy.'));
}

// Explorer

const tbody = document.getElementById('rows');
const PAGE = 50;

      && (!q || (r.question + ' ' + r.answer + ' ' + r.reason).toLowerCase().includes(q)))

      : el('span', {class: 'pill ' + (r.success ? 'ok' : 'low')}, r.success ? 'pass' : 'fail');
    const row = el('tr', {class: 'row'}, el('td', {}, r.id), el('td', {}, r.category), el('td', {}, D.labels[r.metric] || r.metric),
      el('td', {class: 'num'}, el('span', {class: 'pill ' + tone(r.score, D.thresholds[r.metric])}, fmt(r.score))),
      el('td', {}, result), el('td', {}, (r.reason || '').slice(0, 140) + ((r.reason || '').length > 140 ? '…' : '')));
    const box = (k, v, full) => el('div', {class: full ? 'full' : ''}, el('div', {class: 'k'}, k), el('div', {class: 'v'}, v || '–'));
    const detail = el('tr', {class: 'detail', hidden: ''}, el('td', {colspan: '6'}, el('div', {class: 'detail-grid'},
      box('Question', r.question, true), box("Agent's answer", r.answer), box('Reference answer', r.reference),
      box("Judge's reason", r.reason, true), box('Tools used', r.tools.join(', '), true))));
    row.addEventListener('click', () => detail.hidden = !detail.hidden);
    tbody.append(row, detail);
  }
  const shown = showAll ? list.length : Math.min(list.length, PAGE);
  document.getElementById('count').textContent = `${shown} shown · ${list.length} match · ${D.rows.length} scores`;
}
document.getElementById('more').addEventListener('click', () => { showAll = true; render(); });
['f-cat', 'f-metric', 'f-fail', 'f-llm'].forEach(id => document.getElementById(id).addEventListener('change', () => { showAll = false; render(); }));
document.getElementById('f-q').addEventListener('input', render);
render();
</script>
</body>
</html>
