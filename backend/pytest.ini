[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-branch

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    live: Calls the real Gemini API (paid); skipped unless RUN_LIVE_TESTS=1
